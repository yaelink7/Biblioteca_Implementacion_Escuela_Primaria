[project]
name = "biblioteca"
version = "0.1.0"
description = "Sistema de gestion bibliotecaria - Escuela Primaria Adalberto Tejeda"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Las letras y los iconos del diseno viajan dentro del paquete
[tool.setuptools.package-data]
"biblioteca.ui" = ["recursos/fuentes/*", "recursos/iconos/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
