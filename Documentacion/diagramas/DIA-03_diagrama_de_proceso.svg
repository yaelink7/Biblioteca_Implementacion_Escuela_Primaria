<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1560" width="1420" height="1560" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="pta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5D6675"/>
    </marker>
  </defs>
  <style>
    .carril { fill:#FBFCFE; stroke:#D8DEE9; stroke-width:1.5; }
    .paso   { fill:#ffffff; stroke:#5D6675; stroke-width:1.3; }
    .pg     { fill:#EEF2F8; stroke:#2D4B73; stroke-width:1.8; }
    .dec    { fill:#FDF3E7; stroke:#A8621B; stroke-width:1.6; }
    .err    { fill:#FDECEC; stroke:#C0392B; stroke-width:1.5; }
    .errapp { fill:#ffffff; stroke:#C0392B; stroke-width:1.5; }
    .fl     { stroke:#5D6675; stroke-width:1.5; fill:none; }
    .t-paso { font-size:12.5px; fill:#1B2430; text-anchor:middle; }
    .t-carril{ font-size:12px; font-weight:bold; fill:#2D4B73; text-anchor:middle; letter-spacing:1px; }
    .t-eti  { font-size:11.5px; fill:#A8621B; text-anchor:middle; font-weight:bold; }
    .t-sec  { font-size:17px; font-weight:bold; fill:#2D4B73; text-anchor:middle; }
    .tit    { font-size:21px; font-weight:bold; fill:#2D4B73; text-anchor:middle; }
    .sub    { font-size:12px; fill:#5D6675; text-anchor:middle; }
  </style>
  <rect width="1420" height="1560" fill="#ffffff"/>
  <text x="710" y="36" class="tit">Diagrama de proceso · préstamo y devolución</text>
  <text x="710" y="58" class="sub">Lo del carril de PostgreSQL lo hace la base por su cuenta: el cliente no lo pide ni puede saltárselo</text>
    <rect x="20" y="84" width="340" height="1400" rx="8" class="carril"/>
  <text x="190" y="112" class="t-carril">BIBLIOTECARIO</text>
  <rect x="400" y="84" width="400" height="1400" rx="8" class="carril"/>
  <text x="600" y="112" class="t-carril">APLICACIÓN DE ESCRITORIO</text>
  <rect x="835" y="84" width="480" height="1400" rx="8" class="carril"/>
  <text x="1075" y="112" class="t-carril">POSTGRESQL · aquí viven las reglas</text>
  <text x="710" y="160" class="t-sec">Registrar un préstamo</text>
  <rect x="65" y="179" width="250" height="52" rx="5" class="paso"/>
  <text x="190" y="210" class="t-paso">Abre «Nuevo préstamo»</text>
  <rect x="65" y="259" width="250" height="52" rx="5" class="paso"/>
  <text x="190" y="282" class="t-paso">Escribe nombre,</text>
  <text x="190" y="298" class="t-paso">código o salón</text>
  <rect x="450" y="259" width="300" height="52" rx="5" class="paso"/>
  <text x="600" y="282" class="t-paso">Busca coincidencia parcial</text>
  <text x="600" y="298" class="t-paso">en perfiles + usuarios</text>
  <rect x="65" y="349" width="250" height="52" rx="5" class="paso"/>
  <text x="190" y="372" class="t-paso">Selecciona alumno</text>
  <text x="190" y="388" class="t-paso">y escribe título o autor</text>
  <rect x="450" y="349" width="300" height="52" rx="5" class="paso"/>
  <text x="600" y="372" class="t-paso">Busca coincidencia parcial</text>
  <text x="600" y="388" class="t-paso">en libros</text>
  <rect x="65" y="439" width="250" height="52" rx="5" class="paso"/>
  <text x="190" y="462" class="t-paso">Selecciona libro y pulsa</text>
  <text x="190" y="478" class="t-paso">«Registrar préstamo»</text>
  <rect x="450" y="434" width="300" height="62" rx="5" class="paso"/>
  <text x="600" y="454" class="t-paso">Envía INSERT:</text>
  <text x="600" y="470" class="t-paso">libro_id, usuario_id,</text>
  <text x="600" y="486" class="t-paso">registrado_por</text>
  <rect x="910" y="544" width="330" height="52" rx="5" class="pg"/>
  <text x="1075" y="567" class="t-paso">calcular_fecha_limite</text>
  <text x="1075" y="583" class="t-paso">before insert</text>
  <rect x="860" y="624" width="430" height="52" rx="5" class="pg"/>
  <text x="1075" y="647" class="t-paso">fecha_limite = fecha_prestamo + 7</text>
  <text x="1075" y="663" class="t-paso">siempre: ignora la que mande el cliente</text>
  <polygon points="1075,717 1225,755 1075,793 925,755" class="dec"/>
  <text x="1075" y="752" class="t-paso">¿el alumno ya tiene</text>
  <text x="1075" y="767" class="t-paso">un préstamo abierto?</text>
  <rect x="910" y="839" width="330" height="52" rx="5" class="pg"/>
  <text x="1075" y="862" class="t-paso">mover_inventario</text>
  <text x="1075" y="878" class="t-paso">after insert</text>
  <polygon points="1075,922 1225,960 1075,998 925,960" class="dec"/>
  <text x="1075" y="957" class="t-paso">¿el libro está activo</text>
  <text x="1075" y="972" class="t-paso">y quedan ejemplares?</text>
  <rect x="910" y="1039" width="330" height="52" rx="5" class="pg"/>
  <text x="1075" y="1070" class="t-paso">existencias = existencias − 1</text>
  <rect x="450" y="1134" width="300" height="52" rx="5" class="paso"/>
  <text x="600" y="1165" class="t-paso">Recarga desde v_prestamos</text>
  <rect x="625" y="731" width="190" height="48" rx="5" class="err"/>
  <text x="720" y="752" class="t-paso">Ya tiene un</text>
  <text x="720" y="768" class="t-paso">préstamo activo</text>
  <rect x="625" y="936" width="190" height="48" rx="5" class="err"/>
  <text x="720" y="957" class="t-paso">Sin ejemplares</text>
  <text x="720" y="973" class="t-paso">o libro dado de baja</text>
  <rect x="475" y="1034" width="250" height="52" rx="5" class="errapp"/>
  <text x="600" y="1057" class="t-paso">Traduce el error</text>
  <text x="600" y="1073" class="t-paso">y explica qué hacer</text>
  <path d="M 190 231 L 190 259" class="fl" marker-end="url(#pta)"/>
  <path d="M 360 285 L 450 285" class="fl" marker-end="url(#pta)"/>
  <path d="M 450 300 L 360 349" class="fl" marker-end="url(#pta)"/>
  <path d="M 360 375 L 450 375" class="fl" marker-end="url(#pta)"/>
  <path d="M 450 390 L 360 439" class="fl" marker-end="url(#pta)"/>
  <path d="M 315 465 L 450 465" class="fl" marker-end="url(#pta)"/>
  <path d="M 750 480 L 910 555" class="fl" marker-end="url(#pta)"/>
  <path d="M 1075 596 L 1075 624" class="fl" marker-end="url(#pta)"/>
  <path d="M 1075 676 L 1075 717" class="fl" marker-end="url(#pta)"/>
  <path d="M 1075 793 L 1075 839" class="fl" marker-end="url(#pta)"/>
  <text x="1087.0" y="820.0" class="t-eti" text-anchor="start">no</text>
  <path d="M 1075 891 L 1075 922" class="fl" marker-end="url(#pta)"/>
  <path d="M 1075 998 L 1075 1039" class="fl" marker-end="url(#pta)"/>
  <text x="1087.0" y="1022.5" class="t-eti" text-anchor="start">sí</text>
  <path d="M 1075 1091 L 750 1160" class="fl" marker-end="url(#pta)"/>
  <path d="M 925 755 L 815 755" class="fl" marker-end="url(#pta)"/>
  <text x="882.0" y="759.0" class="t-eti" text-anchor="start">sí</text>
  <path d="M 925 960 L 815 960" class="fl" marker-end="url(#pta)"/>
  <text x="882.0" y="964.0" class="t-eti" text-anchor="start">no</text>
  <path d="M 625 755 H 505 V 1030" class="fl" marker-end="url(#pta)"/>
  <path d="M 625 960 H 565 V 1030" class="fl" marker-end="url(#pta)"/>
  <text x="710" y="1245" class="t-sec">Registrar una devolución</text>
  <rect x="65" y="1269" width="250" height="52" rx="5" class="paso"/>
  <text x="190" y="1292" class="t-paso">Elige el préstamo y pulsa</text>
  <text x="190" y="1308" class="t-paso">«Registrar devolución»</text>
  <rect x="450" y="1264" width="300" height="62" rx="5" class="paso"/>
  <text x="600" y="1284" class="t-paso">Envía UPDATE:</text>
  <text x="600" y="1300" class="t-paso">estado = 'devuelto'</text>
  <text x="600" y="1316" class="t-paso">y nada más</text>
  <rect x="910" y="1269" width="330" height="52" rx="5" class="pg"/>
  <text x="1075" y="1292" class="t-paso">sellar_devolucion</text>
  <text x="1075" y="1308" class="t-paso">before update of estado</text>
  <rect x="860" y="1349" width="430" height="52" rx="5" class="pg"/>
  <text x="1075" y="1372" class="t-paso">fecha_devolucion = hoy()</text>
  <text x="1075" y="1388" class="t-paso">la fecha de la escuela, no la del equipo</text>
  <rect x="910" y="1419" width="330" height="52" rx="5" class="pg"/>
  <text x="1075" y="1450" class="t-paso">mover_inventario: existencias + 1</text>
  <rect x="450" y="1419" width="300" height="52" rx="5" class="paso"/>
  <text x="600" y="1450" class="t-paso">Recarga desde v_prestamos</text>
  <path d="M 315 1295 L 450 1295" class="fl" marker-end="url(#pta)"/>
  <path d="M 750 1295 L 910 1295" class="fl" marker-end="url(#pta)"/>
  <path d="M 1075 1321 L 1075 1349" class="fl" marker-end="url(#pta)"/>
  <path d="M 1075 1401 L 1075 1419" class="fl" marker-end="url(#pta)"/>
  <path d="M 910 1445 L 750 1445" class="fl" marker-end="url(#pta)"/>
  <g transform="translate(60,1530)">
    <rect x="0" y="-13" width="20" height="14" class="pg"/>
    <text x="32" y="-2" class="sub" text-anchor="start">lo ejecuta la base</text>
    <polygon points="230,-19 262,-6 230,7 198,-6" class="dec"/>
    <text x="274" y="-2" class="sub" text-anchor="start">decisión de la base</text>
    <rect x="450" y="-13" width="20" height="14" class="err"/>
    <text x="482" y="-2" class="sub" text-anchor="start">rechazo con mensaje propio</text>
  </g>
</svg>