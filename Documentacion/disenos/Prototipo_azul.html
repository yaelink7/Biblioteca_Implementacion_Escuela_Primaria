<script>
/* Propuesta C · Luminosa (azul claro). Solo dibuja: el controlador decide qué
   pasa con cada botón. Préstamos, Catálogo y Deudores son tarjetas; Alumnos y
   Empleados, listas. */
'use strict';

const Tema = (() => {
  const ESCUELA = 'Esc. Prim. Adalberto Tejeda';
  const SECCIONES = [['catalogo', 'Catálogo'], ['prestamos', 'Préstamos'], ['alumnos', 'Alumnos'],
    ['deudores', 'Deudores'], ['empleados', 'Empleados']];
  const ico = (n, t) => Iconos.svg(n, t);

  const inicial = titulo => {
    const palabras = titulo.split(' ');
    const articulo = ['El', 'La', 'Las', 'Los', 'Un', 'Una'].includes(palabras[0]) && palabras.length > 1;
    return (articulo ? palabras[1] : palabras[0]).charAt(0).toUpperCase();
  };

  const boton = (texto, icono, { id = '', clase = 'btn-suave', accion = '', deshabilitado = false, datos = '' } = {}) =>
    `<button type="button"${id ? ` id="${id}"` : ''} class="btn ${clase}"${accion ? ` data-accion="${accion}"` : ''}${deshabilitado ? ' disabled' : ''}${datos}>${icono ? ico(icono, 16) : ''}${texto}</button>`;

  const busqueda = (ctx, clave, etiqueta, marcador) => `<label for="buscar-${clave}" class="sr">${etiqueta}</label>
    <div class="campo-busqueda">${ico('buscar')}<input id="buscar-${clave}" type="search" placeholder="${marcador}"
      value="${ctx.x(ctx.E.busqueda[clave])}" data-busqueda="${clave}" autocomplete="off"></div>`;

  const encabezado = (ctx, pantalla, titulo, resumen, acciones = '') => {
    const aviso = ctx.avisoDe(pantalla);
    return `<div class="encabezado"><div class="encabezado-texto">
        <h1 class="titulo" id="titulo-pantalla" tabindex="-1">${titulo}</h1>
        <p class="resumen${aviso ? ' resumen-aviso' : ''}" role="status">${aviso ? ico('listo', 16) + ctx.x(aviso) : resumen}</p></div>
      ${acciones ? `<div class="acciones">${acciones}</div>` : ''}</div>`;
  };

  const vacio = texto => `<div class="vacio">${ico('info', 18)}<span>${texto}</span></div>`;
  const avatar = (texto, grande) => `<span class="avatar${grande ? ' avatar-grande' : ''}" aria-hidden="true">${texto}</span>`;

  function cabecera(ctx, tabla, col, texto) {
    if (!col) return `<th scope="col">${texto}</th>`;
    const orden = ctx.E.orden[tabla];
    const activo = orden.col === col;
    const sentido = activo ? (orden.asc ? 'ascending' : 'descending') : 'none';
    const flecha = activo ? (orden.asc ? 'arriba' : 'abajo') : 'ordenar';
    return `<th scope="col" aria-sort="${sentido}"><button type="button" class="ordenar${activo ? ' activo' : ''}"
      data-accion="ordenar" data-tabla="${tabla}" data-col="${col}">${texto}${ico(flecha, 14)}</button></th>`;
  }

  // ------------------------------------------------------------ marco
  function lateral(ctx) {
    const { E, B, x, sesion } = ctx;
    const deudores = B.deudores().length;
    const items = SECCIONES.map(([clave, texto]) => {
      const activo = E.pantalla === clave;
      const insignia = clave === 'deudores' && deudores ? `<span class="insignia">${deudores}</span>` : '';
      return `<button type="button" id="menu-${clave}" class="menu-item${activo ? ' activo' : ''}" data-accion="ir"
        data-pantalla="${clave}"${activo ? ' aria-current="page"' : ''}>${ico(clave)}<span>${texto}</span>${insignia}</button>`;
    }).join('');
    return `<aside class="lateral" aria-label="Navegación principal">
      <div class="marca"><div class="logo" aria-hidden="true">LOGO</div>
        <div class="marca-texto"><span class="marca-nombre">Biblioteca escolar</span><span class="marca-escuela">${ESCUELA}</span></div></div>
      <nav class="menu" aria-label="Secciones">${items}</nav>
      <div class="usuario">${avatar(B.iniciales(sesion))}
        <div class="usuario-texto"><span class="usuario-nombre">${x(B.nombreCorto(sesion))}</span>
          <span class="usuario-puesto">${x(sesion.puesto)} · ${sesion.perfil}</span></div>
        <button type="button" id="boton-salir" class="boton-icono" data-accion="cerrar-sesion" aria-label="Cerrar sesión"
          title="Cerrar sesión">${ico('salir')}</button></div>
    </aside>`;
  }

  function app(ctx) {
    return `<div class="app">${lateral(ctx)}<main class="principal">${PANTALLAS[ctx.E.pantalla](ctx)}</main></div>`;
  }

  // ----------------------------------------------------------- catálogo
  function catalogo(ctx) {
    const { E, B, x } = ctx;
    const q = E.busqueda.catalogo;
    const lista = B.librosVisibles(q, E.verBajas).sort((a, b) => a.titulo.localeCompare(b.titulo, 'es'));
    const elegido = lista.find(l => l.id === E.seleccion.catalogo);
    const editable = !!(elegido && elegido.activo);
    const interruptor = `<button type="button" id="interruptor-bajas" class="interruptor" role="switch" aria-checked="${E.verBajas}"
      data-accion="ver-bajas"><span class="interruptor-riel" aria-hidden="true"><span class="interruptor-bola"></span></span>Ver dados de baja</button>`;
    const acciones = interruptor
      + boton('Modificar', 'editar', { id: 'boton-modificar-libro', accion: 'modificar-libro', deshabilitado: !editable })
      + boton('Dar de baja', 'baja', { id: 'boton-baja-libro', clase: 'btn-peligro-suave', accion: 'baja-libro', deshabilitado: !editable });
    const tintes = ['var(--p-suave)', 'var(--p-medio)', 'var(--gris-claro)'];
    const tarjetas = lista.map((l, i) => {
      const elegidoAqui = elegido && elegido.id === l.id;
      const chip = !l.activo ? `<span class="chip chip-gris">${x(B.estadoLibro(l))}</span>`
        : l.existencias ? `<span class="chip chip-azul">${B.estadoLibro(l)}</span>` : '<span class="chip chip-rojo">Sin ejemplares</span>';
      const detalle = [l.coleccion, l.asignatura].filter(Boolean).map(x).join(' · ') || 'Sin colección';
      return `<div class="tarjeta tarjeta-libro${elegidoAqui ? ' seleccionada' : ''}${l.activo ? '' : ' apagada'}" role="button" tabindex="0"
        aria-pressed="${!!elegidoAqui}" data-accion="seleccionar" data-tabla="catalogo" data-id="${l.id}"${l.activo ? ' data-doble="modificar-libro"' : ''}>
        <div class="portada" style="background:${tintes[i % 3]}" aria-hidden="true">${inicial(l.titulo)}</div>
        <div class="tarjeta-texto"><span class="tarjeta-titulo">${x(l.titulo)}</span><span class="tarjeta-sub">${x(l.autor)}</span>
          <span class="tarjeta-meta">${detalle}${l.ano ? ` · ${l.ano}` : ''}</span><span class="tarjeta-pie">${chip}</span></div></div>`;
    }).join('');
    return `<div class="barra-superior">${busqueda(ctx, 'catalogo', 'Buscar en el catálogo', 'Busca por título, autor, colección o asignatura')}
        ${boton('Registrar libro', 'mas', { id: 'boton-nuevo-libro', clase: 'btn-primario btn-grande', accion: 'nuevo-libro' })}</div>
      ${encabezado(ctx, 'catalogo', 'Catálogo', B.resumenCatalogo(lista, !!q.trim()), acciones)}
      ${lista.length ? `<section class="rejilla-tarjetas tres" aria-label="Libros del acervo">${tarjetas}</section>`
        : vacio(`No hay libros que coincidan con «${x(q)}».`)}
      <p class="pista">${ico('info', 16)}Haz clic en un libro para elegirlo; doble clic para modificarlo.</p>`;
  }

  // ----------------------------------------------------------- préstamos
  function prestamos(ctx) {
    const { E, B, N, x } = ctx;
    const conteo = B.conteoPrestamos();
    const lista = B.prestamosVisibles(E.busqueda.prestamos, E.vistaPrestamos)
      .sort((a, b) => a.fechaLimite - b.fechaLimite || a.id - b.id);
    const resumen = `Hoy es ${N.fecha.sinAno(N.hoy)} · ${N.plural(conteo.todos, 'préstamo activo', 'préstamos activos')} · `
      + (conteo.vencidos ? N.plural(conteo.vencidos, 'vencido') : 'ninguno vencido');
    const filtros = [['todos', 'Todos', conteo.todos], ['pronto', 'Por vencer', conteo.pronto], ['vencidos', 'Vencidos', conteo.vencidos]]
      .map(([vista, texto, n]) => `<button type="button" id="vista-${vista}" class="pastilla${E.vistaPrestamos === vista ? ' activa' : ''}"
        aria-pressed="${E.vistaPrestamos === vista}" data-accion="vista-prestamos" data-vista="${vista}">${texto}
        <span class="pastilla-cuenta${vista === 'vencidos' && n ? ' rojo' : ''}">${n}</span></button>`).join('');
    const tarjetas = lista.map(p => {
      const alumno = B.alumno(p.alumnoId);
      const libro = B.libro(p.libroId);
      const s = B.situacion(p);
      const chip = s.tipo === 'vencido' ? 'chip-rojo' : s.tipo === 'pronto' ? 'chip-ambar' : 'chip-azul';
      const color = s.tipo === 'vencido' ? 'var(--barra-roja)' : s.tipo === 'pronto' ? 'var(--barra-ambar)' : 'var(--p)';
      const transcurridos = B.transcurridos(p);
      return `<article class="tarjeta tarjeta-prestamo${E.seleccion.prestamos === p.id ? ' resaltada' : ''}">
        <div class="fila-tarjeta">${avatar(B.iniciales(alumno), true)}
          <div class="tarjeta-texto"><span class="tarjeta-titulo">${x(B.nombreCompleto(alumno))}</span><span class="tarjeta-sub">${B.salon(alumno)}</span></div>
          <span class="chip ${chip}">${s.corto}</span></div>
        <div class="fila-tarjeta"><span class="mosaico" aria-hidden="true">${ico('catalogo')}</span>
          <div class="tarjeta-texto"><span class="tarjeta-obra">${x(libro.titulo)}</span><span class="tarjeta-sub">${x(libro.autor)}</span></div></div>
        <div class="fila-tarjeta">
          <div class="plazo"><div class="plazo-fechas"><span>Prestado ${N.fecha.corta(p.fechaPrestamo)}</span>
            <span>${s.tipo === 'vencido' ? 'Venció' : 'Vence'} ${N.fecha.corta(p.fechaLimite)}</span></div>
            <div class="plazo-barra" role="progressbar" aria-label="Días del plazo transcurridos" aria-valuemin="0"
              aria-valuemax="${N.DIAS_DE_PRESTAMO}" aria-valuenow="${transcurridos}"><span style="width:${Math.round(transcurridos / N.DIAS_DE_PRESTAMO * 100)}%;background:${color}"></span></div></div>
          ${boton('Devolver', 'devolver', { id: `devolver-${p.id}`, accion: 'devolver', datos: ` data-id="${p.id}"` })}</div>
      </article>`;
    }).join('');
    const sinResultados = E.busqueda.prestamos.trim() ? `Ningún préstamo coincide con «${x(E.busqueda.prestamos)}».`
      : E.vistaPrestamos === 'vencidos' ? 'No hay préstamos vencidos.' : E.vistaPrestamos === 'pronto'
        ? 'Ningún préstamo vence en los próximos tres días.' : 'No hay préstamos activos.';
    return `<div class="barra-superior">${busqueda(ctx, 'prestamos', 'Buscar préstamo', 'Busca un alumno, un libro o un salón')}
        ${boton('Nuevo préstamo', 'mas', { id: 'boton-nuevo-prestamo', clase: 'btn-primario btn-grande', accion: 'nuevo-prestamo' })}</div>
      ${encabezado(ctx, 'prestamos', 'Préstamos', resumen, `<div class="pastillas" role="group" aria-label="Mostrar préstamos">${filtros}</div>`)}
      ${lista.length ? `<section class="rejilla-tarjetas dos" aria-label="Préstamos en curso">${tarjetas}</section>` : vacio(sinResultados)}`;
  }

  // ------------------------------------------------------------ alumnos
  function alumnos(ctx) {
    const { E, B, x } = ctx;
    const q = E.busqueda.alumnos;
    const lista = ctx.ordenar('alumnos', B.alumnosVisibles(q), {
      nombre: a => B.nombreCompleto(a), salon: a => B.claveSalon(a) || 'zz',
      contacto: a => (a.telefono ? 0 : 1), situacion: a => (B.prestamoActivoDe(a.id) ? 0 : 1)
    });
    const elegido = lista.find(a => a.id === E.seleccion.alumnos);
    const acciones = boton('Maestros de grupo', 'maestro', { id: 'boton-maestros', accion: 'maestros' })
      + boton('Modificar', 'editar', { id: 'boton-modificar-alumno', accion: 'modificar-alumno', deshabilitado: !elegido })
      + boton('Ver historial', 'historial', { id: 'boton-historial', accion: 'historial', deshabilitado: !elegido });
    const filas = lista.map(a => {
      const activo = B.prestamoActivoDe(a.id);
      const maestro = B.maestroDe(a);
      const contacto = a.telefono ? `<span class="con-icono">${ico('telefono', 16)}${x(a.telefono)}</span>`
        : `<span class="con-icono texto-rojo fuerte">${ico('alerta', 16)}Sin contacto</span>`;
      let situacion = '<span class="chip chip-gris">Sin préstamos</span>';
      if (activo) {
        const vencido = B.situacion(activo).tipo === 'vencido';
        situacion = `<span class="chip ${vencido ? 'chip-rojo' : 'chip-azul'} chip-largo">Tiene «${x(B.libro(activo.libroId).titulo)}»${vencido ? ' · vencido' : ''}</span>`;
      }
      const esElegido = elegido && elegido.id === a.id;
      return `<tr class="fila${esElegido ? ' seleccionada' : ''}" tabindex="0" data-accion="seleccionar" data-tabla="alumnos"
        data-id="${a.id}" data-doble="modificar-alumno">
        <td><div class="persona">${avatar(B.iniciales(a))}<div class="persona-texto"><span class="persona-nombre">${x(B.nombreCompleto(a))}</span>
          <span class="persona-sub">${x(a.codigo)}${esElegido ? '<span class="sr"> · elegido</span>' : ''}</span></div></div></td>
        <td><span class="chip-salon">${B.salon(a)}</span><span class="persona-sub bloque">${maestro ? x(maestro) : 'Sin maestro asignado'}</span></td>
        <td>${contacto}</td><td>${situacion}</td></tr>`;
    }).join('');
    return `<div class="barra-superior">${busqueda(ctx, 'alumnos', 'Buscar alumno', 'Busca por nombre, código, CURP o salón (4B)')}
        ${boton('Registrar alumno', 'mas', { id: 'boton-nuevo-alumno', clase: 'btn-primario btn-grande', accion: 'nuevo-alumno' })}</div>
      ${encabezado(ctx, 'alumnos', 'Alumnos', B.resumenAlumnos(lista), acciones)}
      ${lista.length ? `<section class="lista" aria-label="Padrón de alumnos"><table class="tabla"><thead><tr>
          ${cabecera(ctx, 'alumnos', 'nombre', 'Alumno')}${cabecera(ctx, 'alumnos', 'salon', 'Salón y maestro')}
          ${cabecera(ctx, 'alumnos', 'contacto', 'Contacto del tutor')}${cabecera(ctx, 'alumnos', 'situacion', 'Situación')}
        </tr></thead><tbody>${filas}</tbody></table></section>` : vacio(`Nadie coincide con «${x(q)}».`)}
      <p class="pista">${ico('info', 16)}Haz clic en un alumno para elegirlo; doble clic para modificarlo.</p>`;
  }

  // ----------------------------------------------------------- deudores
  function deudores(ctx) {
    const { E, B, N, x } = ctx;
    const todos = B.deudores();
    const salones = [...new Set(todos.map(d => B.salon(d.alumno)))].sort();
    const elegido = salones.includes(E.salonDeudores) ? E.salonDeudores : 'Todos';
    const lista = B.deudores(elegido);
    const criticos = lista.filter(d => d.situacion.dias >= N.DIAS_CRITICOS).length;
    const opciones = ['Todos', ...salones].map(s => `<option${s === elegido ? ' selected' : ''}>${s}</option>`).join('');
    const controles = `<label for="salon-deudores" class="etiqueta-linea">Filtrar por salón</label>
      <div class="selector selector-linea"><select id="salon-deudores" data-cambio="salon-deudores">${opciones}</select>${ico('abajo', 16)}</div>
      ${boton('Actualizar', 'actualizar', { id: 'boton-actualizar', accion: 'actualizar-deudores' })}`;
    const peor = lista[0];
    const resumen = lista.length ? `<section class="tarjeta resumen-deudores" aria-label="Resumen del reporte">
        <div class="cifra"><span class="cifra-numero${criticos ? ' texto-rojo' : ''}">${lista.length}</span>
          <span class="cifra-texto">${lista.length === 1 ? 'alumno con adeudo' : 'alumnos con adeudo'}</span></div>
        <div class="separador-vertical" aria-hidden="true"></div>
        <div class="dato"><span class="dato-etiqueta">El más atrasado</span>
          <span class="dato-valor">${x(B.nombreCompleto(peor.alumno))}, ${N.plural(peor.situacion.dias, 'día')}${criticos
            ? ` · ${criticos} con más de ${N.DIAS_CRITICOS} días` : ''}</span></div></section>`
      : `<section class="tarjeta resumen-deudores sin-deudores"><div class="cifra">${ico('listo', 28)}<span class="cifra-texto">Sin deudores</span></div>
        <span class="dato-valor">Todos los préstamos están dentro de su plazo.</span></section>`;
    const tarjetas = lista.map(d => {
      const critico = d.situacion.dias >= N.DIAS_CRITICOS;
      return `<article class="tarjeta tarjeta-deudor">
        <div class="fila-tarjeta">${avatar(B.iniciales(d.alumno), true)}
          <div class="tarjeta-texto"><span class="tarjeta-titulo">${x(B.nombreCompleto(d.alumno))}</span><span class="tarjeta-sub">${B.salon(d.alumno)}</span></div>
          <span class="chip ${critico ? 'chip-rojo' : 'chip-ambar'}">${N.plural(d.situacion.dias, 'día')} de retraso</span></div>
        <div class="fila-tarjeta"><span class="mosaico" aria-hidden="true">${ico('catalogo')}</span><span class="tarjeta-obra">${x(d.libro.titulo)}</span></div>
        <div class="datos-deudor">
          <div class="dato"><span class="dato-etiqueta">Debió entregar</span><span class="dato-valor">${N.fecha.numerica(d.prestamo.fechaLimite)}</span></div>
          <div class="dato"><span class="dato-etiqueta">Contacto del tutor</span><span class="dato-valor con-icono${d.alumno.telefono ? '' : ' texto-rojo'}">${ico('telefono', 16)}${d.alumno.telefono ? x(d.alumno.telefono) : 'Sin contacto registrado'}</span></div>
        </div></article>`;
    }).join('');
    return `${encabezado(ctx, 'deudores', 'Deudores', `Generado el ${N.fecha.numerica(E.generado)} a las ${N.fecha.hora(E.generado)}`, controles)}
      ${resumen}
      ${lista.length ? `<section class="rejilla-tarjetas dos" aria-label="Alumnos con adeudo">${tarjetas}</section>` : ''}
      <p class="pista">${ico('info', 16)}El reporte se genera del estado actual de los préstamos. No requiere revisar registros a mano.</p>`;
  }

  // ---------------------------------------------------------- empleados
  function empleados(ctx) {
    const { E, B, N, x, sesion } = ctx;
    const esAdministrador = sesion.perfil === 'administrador';
    const lista = ctx.ordenar('empleados', E.datos.empleados, {
      codigo: e => e.codigo, nombre: e => B.nombreCompleto(e), puesto: e => e.puesto, correo: e => e.correo, perfil: e => e.perfil
    });
    const elegido = lista.find(e => e.id === E.seleccion.empleados);
    const administradores = lista.filter(e => e.perfil === 'administrador').length;
    const resumen = `${N.plural(lista.length, 'persona')} en la plantilla${administradores ? ` · ${administradores} con perfil de administrador` : ''}`;
    const aviso = esAdministrador ? 'Como administrador puedes registrar personal y cambiar su perfil de acceso.'
      : 'Puedes registrar y modificar personal. Cambiar el perfil de acceso de alguien queda reservado al administrador.';
    const filas = lista.map(e => {
      const esElegido = elegido && elegido.id === e.id;
      return `<tr class="fila${esElegido ? ' seleccionada' : ''}" tabindex="0" data-accion="seleccionar" data-tabla="empleados"
        data-id="${e.id}" data-doble="modificar-empleado">
        <td><div class="persona">${avatar(B.iniciales(e))}<div class="persona-texto"><span class="persona-nombre">${x(B.nombreCompleto(e))}${e.id === sesion.id ? ' <span class="tu">(tú)</span>' : ''}</span>
          <span class="persona-sub">${x(e.codigo)}</span></div></div></td>
        <td>${x(e.puesto)}</td><td><span class="con-icono">${ico('correo', 16)}${x(e.correo)}</span></td>
        <td><span class="chip ${e.perfil === 'administrador' ? 'chip-ambar' : 'chip-gris'}">${e.perfil === 'administrador' ? 'Administrador' : 'Bibliotecario'}</span></td></tr>`;
    }).join('');
    const acciones = boton('Modificar', 'editar', { id: 'boton-modificar-empleado', accion: 'modificar-empleado', deshabilitado: !elegido })
      + boton('Registrar empleado', 'mas', { id: 'boton-nuevo-empleado', clase: 'btn-primario', accion: 'nuevo-empleado' });
    return `${encabezado(ctx, 'empleados', 'Empleados', resumen, acciones)}
      <div class="aviso-permisos" role="note">${ico('escudo')}${aviso}</div>
      <section class="lista" aria-label="Plantilla"><table class="tabla"><thead><tr>
        ${cabecera(ctx, 'empleados', 'nombre', 'Nombre')}${cabecera(ctx, 'empleados', 'puesto', 'Puesto')}
        ${cabecera(ctx, 'empleados', 'correo', 'Correo')}${cabecera(ctx, 'empleados', 'perfil', 'Perfil')}
      </tr></thead><tbody>${filas}</tbody></table></section>
      <p class="pista">${ico('info', 16)}Prueba entrar como bibliotecario: el perfil de acceso queda bloqueado en el formulario.</p>`;
  }
  const PANTALLAS = { catalogo, prestamos, alumnos, deudores, empleados };

  // ----------------------------------------------------------------- login
  function login(ctx) {
    const { E, B, x } = ctx;
    const L = E.login;
    const rapido = (id, perfil, titulo) => {
      const e = B.empleado(id);
      return `<button type="button" class="perfil-rapido" id="entrar-${perfil}" data-accion="entrar-como" data-perfil="${perfil}"${L.ocupado ? ' disabled' : ''}>
        ${avatar(B.iniciales(e))}<span class="perfil-rapido-texto"><strong>${titulo}</strong><span>${x(B.nombreCorto(e))} · ${x(e.puesto)}</span></span>${ico('flecha', 16)}</button>`;
    };
    return `<div class="login">
      <main class="login-lado">
        <div class="marca"><div class="logo" aria-hidden="true">LOGO</div>
          <div class="marca-texto"><span class="marca-nombre">Biblioteca Escolar</span><span class="marca-escuela">Escuela Primaria Adalberto Tejeda</span></div></div>
        <div class="login-centro">
          <form class="login-form" data-formulario="login" novalidate>
            <h1 class="login-titulo">Iniciar sesión</h1>
            <p class="login-sub">Escribe el correo y la contraseña de tu cuenta.</p>
            <div class="campo"><label for="correo">Correo electrónico</label>
              <div class="campo-icono">${ico('correo')}<input id="correo" name="correo" type="email" value="${x(L.correo)}"
                placeholder="usuario@ejemplo.com" autocomplete="username"></div></div>
            <div class="campo"><label for="contrasena">Contraseña</label>
              <div class="campo-icono">${ico('candado')}<input id="contrasena" name="contrasena" type="password" autocomplete="current-password"></div></div>
            <p class="login-error" id="error-login" role="alert">${L.error ? ico('alerta', 16) + x(L.error) : ''}</p>
            <button type="submit" id="boton-entrar" class="btn btn-primario btn-grande btn-ancho"${L.ocupado ? ' disabled' : ''}>${L.ocupado ? 'Verificando…' : 'Entrar'}</button>
          </form>
          <section class="entrada-rapida" aria-labelledby="titulo-rapida">
            <p class="entrada-rapida-titulo" id="titulo-rapida">Entrar rápido <span>· solo en este prototipo</span></p>
            <div class="entrada-rapida-botones">${rapido(1, 'administrador', 'Administrador')}${rapido(2, 'bibliotecario', 'Bibliotecario')}</div>
            <p class="entrada-rapida-nota">En el formulario, las cuentas de ejemplo aceptan cualquier contraseña.</p>
          </section>
        </div>
      </main>
      <section class="login-ilustracion" aria-hidden="true">
        <div class="burbuja burbuja-uno"></div><div class="burbuja burbuja-dos"></div>
        <svg viewBox="0 0 320 240" class="libro-abierto">
          <path d="M12 46 L12 206 C 62 192, 118 194, 160 214 C 202 194, 258 192, 308 206 L308 46 Z" class="tapa"/>
          <path d="M160 46 C 120 26, 62 26, 22 40 L22 196 C 62 182, 120 182, 160 202 Z" class="hoja"/>
          <path d="M160 46 C 200 26, 258 26, 298 40 L298 196 C 258 182, 200 182, 160 202 Z" class="hoja"/>
          <path d="M160 46 V202" class="lomo"/>
          <g class="renglones"><path d="M46 70 C 80 62, 112 62, 138 72"/><path d="M46 92 C 80 84, 112 84, 138 94"/>
            <path d="M46 114 C 80 106, 112 106, 138 116"/><path d="M46 136 C 80 128, 112 128, 120 132"/>
            <path d="M182 72 C 208 62, 240 62, 274 70"/><path d="M182 94 C 208 84, 240 84, 274 92"/>
            <path d="M182 116 C 208 106, 240 106, 274 114"/><path d="M182 138 C 208 128, 230 128, 250 132"/></g>
          <path d="M246 32 L246 84 L256 74 L266 84 L266 32" class="cinta"/>
          <path d="M58 -6 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" class="destello"/>
          <path d="M286 -18 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z" class="destello"/>
        </svg>
      </section>
    </div>`;
  }

  return { app, login };
})();

</script>
<script>
/* Controlador del prototipo: estado, eventos, formularios y cuadros de diálogo.
   El tema (azul o mostaza) solo dibuja las pantallas; todo lo que pasa al
   pulsar un botón vive aquí, y las reglas se le preguntan al núcleo. */
'use strict';

(() => {
  const N = Nucleo;
  const ico = Iconos.svg;
  const x = N.escapar;

  const E = {
    datos: N.datosIniciales(),
    sesion: null,
    pantalla: 'prestamos',
    busqueda: { catalogo: '', prestamos: '', alumnos: '' },
    verBajas: false,
    vistaPrestamos: 'todos',
    salonDeudores: 'Todos',
    seleccion: { catalogo: null, prestamos: null, alumnos: null, empleados: null },
    orden: {
      catalogo: { col: 'titulo', asc: true },
      prestamos: { col: 'vence', asc: true },
      alumnos: { col: 'nombre', asc: true },
      empleados: { col: 'codigo', asc: true }
    },
    generado: new Date(),
    aviso: null,
    login: { correo: '', error: '', ocupado: false },
    dialogo: null,
    alerta: null,
    volverA: null
  };
  const B = N.crear(E.datos);
  const raiz = document.getElementById('app');
  const capa = document.getElementById('capa');

  // ------------------------------------------------------------ pintar
  function avisoDe(pantalla) {
    return E.aviso && E.aviso.pantalla === pantalla && Date.now() < E.aviso.hasta ? E.aviso.texto : '';
  }

  function ordenar(tabla, lista, claves) {
    const { col, asc } = E.orden[tabla];
    const valor = claves[col];
    if (!valor) return lista;
    return [...lista].sort((a, b) => {
      const va = valor(a);
      const vb = valor(b);
      const r = typeof va === 'number' && typeof vb === 'number' ? va - vb
        : String(va).localeCompare(String(vb), 'es', { numeric: true, sensitivity: 'base' });
      return asc ? r : -r;
    });
  }

  function contexto() {
    return { E, B, N, ico, x, ordenar, avisoDe, sesion: E.sesion && B.empleado(E.sesion.id) };
  }

  // Repinta sin perder el foco ni lo que se estaba escribiendo.
  function pintar(contenedor, html) {
    const activo = document.activeElement;
    const id = activo && activo.id && contenedor.contains(activo) ? activo.id : null;
    let inicio = null;
    let fin = null;
    try {
      if (id && typeof activo.selectionStart === 'number') { inicio = activo.selectionStart; fin = activo.selectionEnd; }
    } catch (e) { /* los campos numéricos no tienen selección */ }
    contenedor.innerHTML = html;
    if (id) {
      const el = document.getElementById(id);
      if (el) {
        el.focus({ preventScroll: true });
        try { if (inicio !== null) el.setSelectionRange(inicio, fin); } catch (e) { /* idem */ }
      }
    }
  }

  function render() {
    const y = window.scrollY;
    pintar(raiz, E.sesion ? Tema.app(contexto()) : Tema.login(contexto()));
    window.scrollTo(0, y);
    renderDialogo();
  }

  function renderDialogo() {
    let html = '';
    if (E.dialogo) html += DIALOGOS[E.dialogo.tipo](E.dialogo);
    if (E.alerta) html += dialogoAlerta(E.alerta);
    pintar(capa, html);
    const abierto = !!(E.dialogo || E.alerta);
    raiz.inert = abierto;
    document.body.classList.toggle('con-dialogo', abierto);
    if (E.alerta && E.alerta.enfocar) {
      E.alerta.enfocar = false;
      enfocar('alerta-aceptar');
    } else if (E.dialogo && E.dialogo.enfocar) {
      E.dialogo.enfocar = false;
      const primero = capa.querySelector('.dialogo [data-primero], .dialogo input, .dialogo select, .dialogo-pie .btn-primario');
      if (primero) primero.focus({ preventScroll: true });
    }
  }

  function enfocar(id) {
    const el = document.getElementById(id);
    if (el) el.focus({ preventScroll: true });
  }

  function avisar(pantalla, texto) {
    E.aviso = { pantalla, texto, hasta: Date.now() + 3500 };
    clearTimeout(avisar.reloj);
    avisar.reloj = setTimeout(() => { E.aviso = null; render(); }, 3600);
  }

  function abrir(dialogo) {
    const activo = document.activeElement;
    E.volverA = activo && activo.id ? activo.id : null;
    E.dialogo = Object.assign({ enfocar: true }, dialogo);
    render();
  }

  function cerrarDialogo() {
    E.dialogo = null;
    E.alerta = null;
    render();
    const destino = (E.volverA && document.getElementById(E.volverA)) || document.getElementById('titulo-pantalla');
    if (destino) destino.focus({ preventScroll: true });
  }

  function mostrarAlerta(titulo, error) {
    E.alerta = { titulo, error, detalle: false, enfocar: true };
    renderDialogo();
  }

  function cerrarAlerta() {
    E.alerta = null;
    renderDialogo();
    const destino = capa.querySelector('#dialogo-guardar, .dialogo input, .dialogo .btn-primario');
    if (destino) destino.focus({ preventScroll: true });
  }

  // Un error que no es de la base es un defecto del prototipo, no del usuario.
  function manejar(error, titulo) {
    if (error instanceof N.ErrorDeLaBase) {
      mostrarAlerta(titulo, error);
      return;
    }
    console.error(error);
    mostrarAlerta(titulo, new N.ErrorDeLaBase('El sistema tuvo un error interno.',
      'Avisa al equipo de desarrollo y pásale el detalle de abajo.', String(error)));
  }

  // ------------------------------------------------------ formularios
  const texto = (f, nombre) => (f.elements[nombre] ? f.elements[nombre].value.trim() : '');
  const numero = (f, nombre) => {
    const v = texto(f, nombre);
    return v === '' ? null : Number(v);
  };
  const leerCampos = f => {
    const campos = {};
    [...f.elements].forEach(el => { if (el.name) campos[el.name] = el.value; });
    return campos;
  };

  function entrar(id) {
    if (E.login.ocupado) return;
    E.login.ocupado = true;
    E.login.error = '';
    render();
    setTimeout(() => {
      const empleado = B.empleado(id);
      E.login.ocupado = false;
      E.sesion = { id: empleado.id, perfil: empleado.perfil };
      E.pantalla = 'prestamos';
      render();
      window.scrollTo(0, 0);
      enfocar('titulo-pantalla');
    }, 450);
  }

  const FORMULARIOS = {
    login(f) {
      const correo = texto(f, 'correo');
      const contrasena = f.elements.contrasena.value;
      E.login.correo = correo;
      if (!correo || !contrasena) {
        E.login.error = 'Escribe tu correo y tu contraseña.';
        render();
        enfocar(correo ? 'contrasena' : 'correo');
        return;
      }
      E.login.ocupado = true;
      E.login.error = '';
      render();
      setTimeout(() => {
        E.login.ocupado = false;
        try {
          const empleado = B.iniciarSesion(correo);
          E.sesion = { id: empleado.id, perfil: empleado.perfil };
          E.pantalla = 'prestamos';
          render();
          window.scrollTo(0, 0);
          enfocar('titulo-pantalla');
        } catch (error) {
          E.login.error = error.causa || 'No se pudo iniciar sesión.';
          render();
          enfocar('contrasena');
        }
      }, 600);
    },

    libro(f) {
      const d = E.dialogo;
      d.campos = leerCampos(f);
      const c = {
        titulo: texto(f, 'titulo'), autor: texto(f, 'autor'), editorial: texto(f, 'editorial'),
        coleccion: texto(f, 'coleccion'), asignatura: texto(f, 'asignatura'),
        existencias: numero(f, 'existencias'), ano: numero(f, 'ano'), paginas: numero(f, 'paginas')
      };
      d.errores = N.validarLibro(c, d.modo === 'alta');
      if (d.errores.length) { renderDialogo(); return; }
      try {
        const libro = d.modo === 'alta' ? B.registrarLibro(c) : B.modificarLibro(d.id, c);
        E.seleccion.catalogo = libro.id;
        cerrarDialogo();
        avisar('catalogo', d.modo === 'alta' ? `Se registró «${libro.titulo}».` : `Se actualizó «${libro.titulo}».`);
        render();
      } catch (error) {
        manejar(error, d.modo === 'alta' ? 'No se pudo registrar el libro' : 'No se pudo guardar el libro');
      }
    },

    baja(f) {
      const d = E.dialogo;
      d.motivo = texto(f, 'motivo');
      if (!d.motivo) {
        d.error = 'Indica por qué se da de baja el libro.';
        renderDialogo();
        enfocar('motivo');
        return;
      }
      try {
        const libro = B.darDeBaja(d.id, d.motivo);
        cerrarDialogo();
        avisar('catalogo', `«${libro.titulo}» quedó fuera del acervo.`);
        render();
      } catch (error) {
        manejar(error, 'No se pudo dar de baja');
      }
    },

    alumno(f) {
      const d = E.dialogo;
      d.campos = leerCampos(f);
      const c = {
        codigo: texto(f, 'codigo'), nombre: texto(f, 'nombre'), apellidos: texto(f, 'apellidos'),
        curp: texto(f, 'curp').toUpperCase(), grado: numero(f, 'grado'), grupo: texto(f, 'grupo'),
        telefono: texto(f, 'telefono'), calle: texto(f, 'calle'), colonia: texto(f, 'colonia')
      };
      d.errores = N.validarAlumno(c);
      if (d.errores.length) { renderDialogo(); return; }
      try {
        const alumno = d.modo === 'alta' ? B.registrarAlumno(c) : B.modificarAlumno(d.id, c);
        E.seleccion.alumnos = alumno.id;
        cerrarDialogo();
        avisar('alumnos', d.modo === 'alta' ? `Se registró a ${B.nombreCompleto(alumno)}.`
          : `Se actualizaron los datos de ${B.nombreCompleto(alumno)}.`);
        render();
      } catch (error) {
        manejar(error, d.modo === 'alta' ? 'No se pudo registrar al alumno' : 'No se pudieron guardar los cambios');
      }
    },

    maestros(f) {
      const cambios = {};
      B.salones().forEach(s => { cambios[s] = texto(f, `maestro-${s}`); });
      B.guardarMaestros(cambios);
      cerrarDialogo();
      avisar('alumnos', 'Se guardaron los maestros de grupo.');
      render();
    },

    empleado(f) {
      const d = E.dialogo;
      d.campos = leerCampos(f);
      const original = d.modo === 'cambio' ? B.empleado(d.id) : null;
      const perfil = f.elements.perfil.disabled ? (original ? original.perfil : 'bibliotecario') : texto(f, 'perfil');
      const c = {
        codigo: texto(f, 'codigo'), nombre: texto(f, 'nombre'), apellidos: texto(f, 'apellidos'),
        puesto: texto(f, 'puesto'), perfil, correo: texto(f, 'correo'), telefono: texto(f, 'telefono'),
        calle: texto(f, 'calle'), colonia: texto(f, 'colonia')
      };
      d.errores = N.validarEmpleado(c);
      if (d.errores.length) { renderDialogo(); return; }
      try {
        const empleado = d.modo === 'alta' ? B.registrarEmpleado(c, E.sesion) : B.modificarEmpleado(d.id, c, E.sesion);
        E.seleccion.empleados = empleado.id;
        cerrarDialogo();
        avisar('empleados', d.modo === 'alta' ? `Se registró a ${B.nombreCompleto(empleado)}.`
          : `Se actualizaron los datos de ${B.nombreCompleto(empleado)}.`);
        render();
      } catch (error) {
        manejar(error, d.modo === 'alta' ? 'No se pudo registrar al empleado' : 'No se pudieron guardar los cambios');
      }
    }
  };

  // ------------------------------------------------------------- acciones
  const idDe = (el, tabla) => Number(el.dataset.id || E.seleccion[tabla]);

  const camposDeLibro = l => ({
    titulo: l.titulo, autor: l.autor, editorial: l.editorial, coleccion: l.coleccion, asignatura: l.asignatura,
    existencias: String(l.existencias), ano: l.ano === null ? '' : String(l.ano), paginas: l.paginas === null ? '' : String(l.paginas)
  });
  const camposDeAlumno = a => ({
    codigo: a.codigo, nombre: a.nombre, apellidos: a.apellidos, curp: a.curp, grado: a.grado ? String(a.grado) : '',
    grupo: a.grupo || '', telefono: a.telefono, calle: a.calle, colonia: a.colonia
  });
  const camposDeEmpleado = e => ({
    codigo: e.codigo, nombre: e.nombre, apellidos: e.apellidos, puesto: e.puesto, perfil: e.perfil,
    correo: e.correo, telefono: e.telefono, calle: e.calle, colonia: e.colonia
  });

  function prestar() {
    const d = E.dialogo;
    if (!d.alumnoId || !d.libroId) return;
    try {
      const p = B.registrarPrestamo(d.alumnoId, d.libroId, E.sesion.id);
      E.seleccion.prestamos = p.id;
      E.vistaPrestamos = 'todos';
      E.busqueda.prestamos = '';
      E.pantalla = 'prestamos';
      cerrarDialogo();
      avisar('prestamos', `${B.nombreCompleto(B.alumno(p.alumnoId))} se llevó «${B.libro(p.libroId).titulo}».`);
      render();
    } catch (error) {
      if (!(error instanceof N.ErrorDeLaBase)) { manejar(error, 'No se pudo registrar el préstamo'); return; }
      d.error = error;
      renderDialogo();
    }
  }

  function confirmarDevolucion() {
    const d = E.dialogo;
    const p = B.prestamo(d.id);
    const libro = B.libro(p.libroId);
    B.devolver(d.id);
    if (E.seleccion.prestamos === d.id) E.seleccion.prestamos = null;
    cerrarDialogo();
    avisar('prestamos', `«${libro.titulo}» volvió al acervo.`);
    render();
  }

  const ACCIONES = {
    ir(el) {
      E.pantalla = el.dataset.pantalla;
      render();
      window.scrollTo(0, 0);
    },
    'entrar-como': el => entrar(el.dataset.perfil === 'administrador' ? 1 : 2),
    'cerrar-sesion'() {
      E.sesion = null;
      E.login = { correo: '', error: '', ocupado: false };
      E.pantalla = 'prestamos';
      render();
      window.scrollTo(0, 0);
      enfocar('correo');
    },
    seleccionar(el) {
      E.seleccion[el.dataset.tabla] = Number(el.dataset.id);
      render();
    },
    ordenar(el) {
      const orden = E.orden[el.dataset.tabla];
      if (orden.col === el.dataset.col) orden.asc = !orden.asc;
      else { orden.col = el.dataset.col; orden.asc = true; }
      render();
    },
    'ver-bajas'() {
      E.verBajas = !E.verBajas;
      E.aviso = null;
      render();
    },
    'vista-prestamos'(el) {
      E.vistaPrestamos = el.dataset.vista;
      E.aviso = null;
      render();
    },
    'actualizar-deudores'() {
      E.generado = new Date();
      avisar('deudores', 'Reporte actualizado con el estado actual de los préstamos.');
      render();
    },
    'nuevo-libro': () => abrir({ tipo: 'libro', modo: 'alta', errores: [],
      campos: { titulo: '', autor: '', editorial: '', coleccion: '', asignatura: '', existencias: '1', ano: '', paginas: '' } }),
    'modificar-libro'(el) {
      const libro = B.libro(idDe(el, 'catalogo'));
      if (!libro || !libro.activo) return;
      E.seleccion.catalogo = libro.id;
      abrir({ tipo: 'libro', modo: 'cambio', id: libro.id, campos: camposDeLibro(libro), errores: [] });
    },
    'baja-libro'(el) {
      const libro = B.libro(idDe(el, 'catalogo'));
      if (!libro || !libro.activo) return;
      abrir({ tipo: 'baja', id: libro.id, motivo: '', error: '' });
    },
    'motivo-rapido'(el) {
      E.dialogo.motivo = el.dataset.motivo;
      E.dialogo.error = '';
      renderDialogo();
      enfocar('motivo');
    },
    'nuevo-prestamo': () => abrir({ tipo: 'prestamo', qAlumno: '', qLibro: '', alumnoId: null, libroId: null, error: null }),
    'elegir-alumno'(el) {
      E.dialogo.alumnoId = Number(el.dataset.id);
      E.dialogo.error = null;
      renderDialogo();
    },
    'elegir-libro'(el) {
      E.dialogo.libroId = Number(el.dataset.id);
      E.dialogo.error = null;
      renderDialogo();
    },
    prestar,
    devolver(el) {
      const p = B.prestamo(idDe(el, 'prestamos'));
      if (!p || p.estado !== 'activo') return;
      abrir({ tipo: 'devolucion', id: p.id });
    },
    'confirmar-devolucion': confirmarDevolucion,
    historial(el) {
      const alumno = B.alumno(idDe(el, 'alumnos'));
      if (alumno) abrir({ tipo: 'historial', id: alumno.id });
    },
    'nuevo-alumno': () => abrir({ tipo: 'alumno', modo: 'alta', errores: [],
      campos: { codigo: '', nombre: '', apellidos: '', curp: '', grado: '', grupo: '', telefono: '', calle: '', colonia: '' } }),
    'modificar-alumno'(el) {
      const alumno = B.alumno(idDe(el, 'alumnos'));
      if (!alumno) return;
      E.seleccion.alumnos = alumno.id;
      abrir({ tipo: 'alumno', modo: 'cambio', id: alumno.id, campos: camposDeAlumno(alumno), errores: [] });
    },
    maestros: () => abrir({ tipo: 'maestros', campos: Object.assign({}, E.datos.maestros) }),
    'nuevo-empleado': () => abrir({ tipo: 'empleado', modo: 'alta', errores: [],
      campos: { codigo: '', nombre: '', apellidos: '', puesto: '', perfil: 'bibliotecario', correo: '', telefono: '', calle: '', colonia: '' } }),
    'modificar-empleado'(el) {
      const empleado = B.empleado(idDe(el, 'empleados'));
      if (!empleado) return;
      E.seleccion.empleados = empleado.id;
      abrir({ tipo: 'empleado', modo: 'cambio', id: empleado.id, campos: camposDeEmpleado(empleado), errores: [] });
    },
    'cerrar-dialogo': cerrarDialogo,
    'cerrar-alerta': cerrarAlerta,
    'ver-detalle'() {
      E.alerta.detalle = !E.alerta.detalle;
      renderDialogo();
    }
  };

  // ------------------------------------------------- piezas de diálogo
  function marco({ titulo, subtitulo = '', cuerpo, ancho = 560 }) {
    return `<div class="capa-fondo"><div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="dialogo-titulo"
      style="--ancho:${ancho}px"${E.alerta ? ' inert' : ''}>
      <div class="dialogo-cabeza">
        <div><h2 class="dialogo-titulo" id="dialogo-titulo">${titulo}</h2>${subtitulo ? `<p class="dialogo-subtitulo">${subtitulo}</p>` : ''}</div>
        <button type="button" class="boton-icono" data-accion="cerrar-dialogo" aria-label="Cerrar">${ico('cerrar')}</button>
      </div>${cuerpo}</div></div>`;
  }

  function campo({ id, etiqueta, nombre, valor = '', tipo = 'text', requerido = false, marcador = '', ancho = false,
    ayuda = '', extra = '' }) {
    return `<div class="campo${ancho ? ' campo-ancho' : ''}">
      <label for="${id}">${etiqueta}${requerido ? '<span class="obligatorio" aria-hidden="true"> *</span>' : ''}</label>
      <input id="${id}" name="${nombre}" type="${tipo}" value="${x(valor)}"${marcador ? ` placeholder="${x(marcador)}"` : ''}${requerido ? ' aria-required="true"' : ''}${ayuda ? ` aria-describedby="${id}-ayuda"` : ''} autocomplete="off" ${extra}>
      ${ayuda ? `<p class="campo-ayuda" id="${id}-ayuda">${ayuda}</p>` : ''}
    </div>`;
  }

  function selector({ id, etiqueta, nombre, valor = '', opciones, requerido = false, ancho = false, ayuda = '', bloqueado = false }) {
    const lista = opciones.map(o =>
      `<option value="${x(o.valor)}"${String(o.valor) === String(valor) ? ' selected' : ''}>${x(o.texto)}</option>`).join('');
    return `<div class="campo${ancho ? ' campo-ancho' : ''}">
      <label for="${id}">${etiqueta}${requerido ? '<span class="obligatorio" aria-hidden="true"> *</span>' : ''}</label>
      <div class="selector${bloqueado ? ' selector-bloqueado' : ''}"><select id="${id}" name="${nombre}"${bloqueado ? ' disabled' : ''}${ayuda ? ` aria-describedby="${id}-ayuda"` : ''}>${lista}</select>${ico(bloqueado ? 'candado' : 'abajo', 16)}</div>
      ${ayuda ? `<p class="campo-ayuda" id="${id}-ayuda">${ayuda}</p>` : ''}
    </div>`;
  }

  function errores(lista) {
    if (!lista || !lista.length) return '';
    return `<div class="errores" role="alert"><p class="errores-titulo">${ico('alerta')}Revisa estos datos:</p>
      <ul>${lista.map(e => `<li>${x(e)}</li>`).join('')}</ul></div>`;
  }

  function pie(principal, { peligro = false, tipo = 'submit', accion = '', deshabilitado = false, cancelar = 'Cancelar' } = {}) {
    return `<div class="dialogo-pie">
      <button type="button" class="btn btn-borde" data-accion="cerrar-dialogo">${cancelar}</button>
      <button type="${tipo}" id="dialogo-guardar" class="btn ${peligro ? 'btn-peligro' : 'btn-primario'}"${accion ? ` data-accion="${accion}"` : ''}${deshabilitado ? ' disabled' : ''}>${principal}</button>
    </div>`;
  }

  function dialogoAlerta(a) {
    const error = a.error;
    return `<div class="capa-fondo capa-alerta"><div class="dialogo dialogo-alerta" role="alertdialog" aria-modal="true"
      aria-labelledby="alerta-titulo" aria-describedby="alerta-texto" style="--ancho:470px">
      <div class="alerta-icono">${ico('alerta', 22)}</div>
      <h2 class="dialogo-titulo" id="alerta-titulo">${x(a.titulo)}</h2>
      <p class="alerta-texto" id="alerta-texto"><strong>${x(error.causa)}</strong> ${x(error.queHacer)}</p>
      <button type="button" class="enlace-detalle" data-accion="ver-detalle" aria-expanded="${a.detalle}">${a.detalle ? 'Ocultar' : 'Ver'} detalle técnico</button>
      ${a.detalle ? `<pre class="alerta-detalle">${x(error.detalle)}</pre>` : ''}
      <div class="dialogo-pie"><button type="button" class="btn btn-primario" id="alerta-aceptar" data-accion="cerrar-alerta">Entendido</button></div>
    </div></div>`;
  }

  const DIALOGOS = {
    libro(d) {
      const c = d.campos;
      const colecciones = [{ valor: '', texto: 'Sin colección' },
        ...N.COLECCIONES.map(k => ({ valor: k.nombre, texto: `${k.nombre} · ${k.grados}` }))];
      const asignaturas = [{ valor: '', texto: 'Sin asignatura' }, ...N.ASIGNATURAS.map(a => ({ valor: a, texto: a }))];
      const cuerpo = `<form class="dialogo-cuerpo" data-formulario="libro" novalidate>${errores(d.errores)}
        <div class="rejilla">
          ${campo({ id: 'f-titulo', etiqueta: 'Título', nombre: 'titulo', valor: c.titulo, requerido: true, ancho: true })}
          ${campo({ id: 'f-autor', etiqueta: 'Autor', nombre: 'autor', valor: c.autor, requerido: true })}
          ${campo({ id: 'f-editorial', etiqueta: 'Editorial', nombre: 'editorial', valor: c.editorial })}
          ${selector({ id: 'f-coleccion', etiqueta: 'Colección', nombre: 'coleccion', valor: c.coleccion, opciones: colecciones,
            ayuda: 'Libros del Rincón, con los grados de cada una.' })}
          ${selector({ id: 'f-asignatura', etiqueta: 'Asignatura', nombre: 'asignatura', valor: c.asignatura, opciones: asignaturas })}
          ${campo({ id: 'f-existencias', etiqueta: 'Ejemplares', nombre: 'existencias', valor: c.existencias, tipo: 'number',
            requerido: true, extra: 'min="0" step="1" inputmode="numeric"',
            ayuda: d.modo === 'cambio' ? 'Los que están hoy en el estante.' : '' })}
          ${campo({ id: 'f-ano', etiqueta: 'Año de publicación', nombre: 'ano', valor: c.ano, tipo: 'number',
            marcador: 'Sin especificar', extra: 'min="1400" step="1" inputmode="numeric"' })}
          ${campo({ id: 'f-paginas', etiqueta: 'Número de páginas', nombre: 'paginas', valor: c.paginas, tipo: 'number',
            marcador: 'Sin especificar', extra: 'min="1" step="1" inputmode="numeric"' })}
        </div>
        <p class="nota-campos">* Campos obligatorios</p>
        ${pie('Guardar')}</form>`;
      return marco({ titulo: d.modo === 'alta' ? 'Registrar libro' : 'Modificar libro', cuerpo, ancho: 660,
        subtitulo: d.modo === 'cambio' ? x(B.libro(d.id).titulo) : 'Se agrega al catálogo con los ejemplares que indiques.' });
    },

    baja(d) {
      const libro = B.libro(d.id);
      const motivos = ['Extravío', 'Deterioro', 'Donación'];
      const cuerpo = `<form class="dialogo-cuerpo" data-formulario="baja" novalidate>
        <p class="dialogo-texto">¿Por qué se da de baja «${x(libro.titulo)}»? Sale del catálogo, pero su historial de préstamos se conserva.</p>
        <div class="rejilla">${campo({ id: 'motivo', etiqueta: 'Motivo', nombre: 'motivo', valor: d.motivo, requerido: true, ancho: true,
          marcador: 'Por ejemplo: extravío, deterioro, donación' })}</div>
        <div class="sugerencias" role="group" aria-label="Motivos frecuentes">${motivos.map(m =>
          `<button type="button" class="sugerencia" data-accion="motivo-rapido" data-motivo="${m}">${m}</button>`).join('')}</div>
        ${d.error ? `<p class="error-linea" role="alert">${ico('alerta', 16)}${x(d.error)}</p>` : ''}
        ${pie('Dar de baja', { peligro: true })}</form>`;
      return marco({ titulo: 'Dar de baja', cuerpo, ancho: 540 });
    },

    prestamo(d) {
      const alumnos = B.alumnosVisibles(d.qAlumno)
        .sort((a, b) => B.nombreCompleto(a).localeCompare(B.nombreCompleto(b), 'es'));
      const libros = B.librosVisibles(d.qLibro, false).sort((a, b) => a.titulo.localeCompare(b.titulo, 'es'));
      const alumno = d.alumnoId && B.alumno(d.alumnoId);
      const libro = d.libroId && B.libro(d.libroId);

      const opcionesAlumno = alumnos.map(a => {
        const activo = B.prestamoActivoDe(a.id);
        const nota = activo ? ` · <span class="opcion-nota">tiene «${x(B.libro(activo.libroId).titulo)}»</span>` : '';
        return `<button type="button" class="opcion" data-accion="elegir-alumno" data-id="${a.id}" aria-pressed="${a.id === d.alumnoId}">
          <span class="opcion-principal">${x(B.nombreCompleto(a))}</span>
          <span class="opcion-detalle">${B.salon(a)} · ${x(a.codigo)}${nota}</span></button>`;
      }).join('') || '<p class="opciones-vacio">Nadie coincide con esa búsqueda.</p>';

      const opcionesLibro = libros.map(l => `<button type="button" class="opcion" data-accion="elegir-libro" data-id="${l.id}" aria-pressed="${l.id === d.libroId}">
          <span class="opcion-principal">${x(l.titulo)}</span>
          <span class="opcion-detalle">${x(l.autor)} · <span class="${l.existencias ? '' : 'opcion-agotado'}">${B.estadoLibro(l)}</span></span></button>`)
        .join('') || '<p class="opciones-vacio">Ningún libro coincide con esa búsqueda.</p>';

      let resumen;
      if (alumno && libro) {
        resumen = `<p class="resumen-prestamo"><strong>${x(B.nombreCompleto(alumno))}</strong> (${B.salon(alumno)}) se lleva <strong>${x(libro.titulo)}</strong></p>
          <p class="plazo-prestamo">El plazo es de ${N.DIAS_DE_PRESTAMO} días naturales; la fecha exacta queda registrada al confirmar.</p>`;
      } else {
        resumen = `<p class="resumen-prestamo">${alumno ? 'Ahora elige el libro.' : libro ? 'Ahora elige al alumno.' : 'Elige un alumno y un libro.'}</p>`;
      }
      const error = d.error ? `<div class="error-bloque" role="alert">${ico('alerta')}<div><strong>${x(d.error.causa)}</strong>
        <span>${x(d.error.queHacer)}</span></div></div>` : '';

      const cuerpo = `<div class="dialogo-cuerpo">
        <div class="busquedas">
          <section class="busqueda-paso" aria-labelledby="paso-alumno">
            <h3 class="paso" id="paso-alumno">1. ¿Quién se lo lleva?</h3>
            <div class="busqueda-dialogo">${ico('buscar')}<input id="q-alumno" type="search" data-primero data-busqueda-dialogo="qAlumno"
              value="${x(d.qAlumno)}" placeholder="Nombre, código o salón (4B)" aria-label="Buscar alumno" autocomplete="off"></div>
            <div class="opciones" role="group" aria-label="Alumnos">${opcionesAlumno}</div>
          </section>
          <section class="busqueda-paso" aria-labelledby="paso-libro">
            <h3 class="paso" id="paso-libro">2. ¿Qué libro?</h3>
            <div class="busqueda-dialogo">${ico('buscar')}<input id="q-libro" type="search" data-busqueda-dialogo="qLibro"
              value="${x(d.qLibro)}" placeholder="Título o autor" aria-label="Buscar libro" autocomplete="off"></div>
            <div class="opciones" role="group" aria-label="Libros">${opcionesLibro}</div>
          </section>
        </div>
        <div class="cierre-prestamo" aria-live="polite">${resumen}${error}</div>
        ${pie('Prestar', { tipo: 'button', accion: 'prestar', deshabilitado: !(alumno && libro) })}</div>`;
      return marco({ titulo: 'Registrar préstamo', cuerpo, ancho: 860,
        subtitulo: 'Dos búsquedas y un botón. El plazo y el inventario los calcula la base.' });
    },

    devolucion(d) {
      const p = B.prestamo(d.id);
      const alumno = B.alumno(p.alumnoId);
      const libro = B.libro(p.libroId);
      const s = B.situacion(p);
      const cuerpo = `<div class="dialogo-cuerpo">
        <p class="dialogo-texto">¿${x(B.nombreCompleto(alumno))} devolvió «${x(libro.titulo)}»?</p>
        <dl class="datos-dialogo">
          <dt>Prestado</dt><dd>${N.fecha.conAno(p.fechaPrestamo)}</dd>
          <dt>Vencía</dt><dd>${N.fecha.conAno(p.fechaLimite)}</dd>
          <dt>Situación</dt><dd class="${s.tipo === 'vencido' ? 'texto-rojo' : ''}">${s.texto}</dd>
        </dl>
        <p class="dialogo-nota">La fecha de devolución la pone la base al confirmar, y el ejemplar vuelve al estante.</p>
        ${pie('Sí, lo devolvió', { tipo: 'button', accion: 'confirmar-devolucion', cancelar: 'No' })}</div>`;
      return marco({ titulo: 'Registrar devolución', cuerpo, ancho: 500 });
    },

    historial(d) {
      const alumno = B.alumno(d.id);
      const lista = B.historialDe(alumno.id);
      let resumen = 'Este alumno todavía no ha pedido ningún libro.';
      if (lista.length) {
        const devueltos = lista.filter(p => p.estado === 'devuelto').length;
        const activos = lista.length - devueltos;
        const vencidos = lista.filter(p => B.situacion(p).tipo === 'vencido').length;
        const partes = [N.plural(lista.length, 'préstamo')];
        if (devueltos) partes.push(N.plural(devueltos, 'devuelto'));
        if (activos) partes.push(`${activos} sin devolver`);
        if (vencidos) partes.push(N.plural(vencidos, 'vencido'));
        resumen = partes.join(' · ');
      }
      const filas = lista.map(p => {
        const s = B.situacion(p);
        return `<tr><td>${x(B.libro(p.libroId).titulo)}</td><td>${N.fecha.numerica(p.fechaPrestamo)}</td>
          <td>${N.fecha.numerica(p.fechaLimite)}</td><td>${p.fechaDevolucion ? N.fecha.numerica(p.fechaDevolucion) : '—'}</td>
          <td class="${s.tipo === 'vencido' ? 'texto-rojo' : ''}">${s.texto}</td></tr>`;
      }).join('');
      const cuerpo = `<div class="dialogo-cuerpo">
        <p class="dialogo-texto">${resumen}</p>
        ${lista.length ? `<div class="tabla-dialogo-marco"><table class="tabla-dialogo"><thead><tr><th scope="col">Libro</th>
          <th scope="col">Prestado</th><th scope="col">Vencía</th><th scope="col">Devuelto</th><th scope="col">Situación</th></tr></thead>
          <tbody>${filas}</tbody></table></div>` : ''}
        <p class="dialogo-nota">El historial se conserva aunque el libro se dé de baja del acervo.</p>
        <div class="dialogo-pie"><button type="button" class="btn btn-primario" data-accion="cerrar-dialogo">Cerrar</button></div></div>`;
      return marco({ titulo: 'Historial de préstamos', cuerpo, ancho: 760,
        subtitulo: `${x(B.nombreCompleto(alumno))} · ${B.salon(alumno)} · ${x(alumno.codigo)}` });
    },

    alumno(d) {
      const c = d.campos;
      const clave = c.grado && c.grupo ? `${c.grado}${c.grupo}` : '';
      const maestro = clave ? E.datos.maestros[clave] : '';
      const grados = [{ valor: '', texto: 'Sin asignar' }, ...[1, 2, 3, 4, 5, 6].map(g => ({ valor: String(g), texto: `${g}.º` }))];
      const grupos = [{ valor: '', texto: '—' }, ...N.GRUPOS.map(g => ({ valor: g, texto: g }))];
      const textoMaestro = maestro ? x(maestro)
        : clave ? 'Este salón aún no tiene maestro. Se asigna en «Maestros de grupo».' : 'Se muestra al elegir grado y grupo.';
      const cuerpo = `<form class="dialogo-cuerpo" data-formulario="alumno" novalidate>${errores(d.errores)}
        <div class="rejilla">
          ${campo({ id: 'f-codigo', etiqueta: 'Código', nombre: 'codigo', valor: c.codigo, requerido: true, marcador: 'A-0401' })}
          ${campo({ id: 'f-curp', etiqueta: 'CURP', nombre: 'curp', valor: c.curp, marcador: 'CURV200412MVZRMLA4',
            extra: 'maxlength="18" spellcheck="false" style="text-transform:uppercase"', ayuda: '18 caracteres; se revisa el formato oficial.' })}
          ${campo({ id: 'f-nombre', etiqueta: 'Nombre', nombre: 'nombre', valor: c.nombre, requerido: true })}
          ${campo({ id: 'f-apellidos', etiqueta: 'Apellidos', nombre: 'apellidos', valor: c.apellidos, requerido: true })}
          ${selector({ id: 'f-grado', etiqueta: 'Grado', nombre: 'grado', valor: c.grado, opciones: grados })}
          ${selector({ id: 'f-grupo', etiqueta: 'Grupo', nombre: 'grupo', valor: c.grupo, opciones: grupos })}
          <div class="campo campo-ancho"><span class="etiqueta-campo">Maestro de grupo</span>
            <p class="dato-fijo" aria-live="polite">${ico('maestro', 16)}${textoMaestro}</p></div>
          <p class="separador-campos campo-ancho">Datos del tutor</p>
          ${campo({ id: 'f-telefono', etiqueta: 'Teléfono del tutor', nombre: 'telefono', valor: c.telefono, requerido: true,
            tipo: 'tel', marcador: '229 555 0100' })}
          ${campo({ id: 'f-colonia', etiqueta: 'Colonia', nombre: 'colonia', valor: c.colonia })}
          ${campo({ id: 'f-calle', etiqueta: 'Calle y número', nombre: 'calle', valor: c.calle, ancho: true })}
        </div>
        <p class="nota-campos">* Campos obligatorios. El teléfono del tutor sirve para avisarle si hay un préstamo vencido.</p>
        ${pie('Guardar')}</form>`;
      return marco({ titulo: d.modo === 'alta' ? 'Registrar alumno' : 'Modificar alumno', cuerpo, ancho: 680,
        subtitulo: d.modo === 'cambio' ? x(B.nombreCompleto(B.alumno(d.id))) : 'Sin correo: la escuela se comunica con el tutor por teléfono.' });
    },

    maestros(d) {
      const filas = B.salones().map(s => {
        const etiqueta = `${s.charAt(0)}.º ${s.slice(1)}`;
        const cuantos = E.datos.alumnos.filter(a => a.activo && B.claveSalon(a) === s).length;
        return `<tr><th scope="row">${etiqueta}</th>
          <td><input id="m-${s}" name="maestro-${s}" value="${x(d.campos[s] || '')}" placeholder="Sin asignar"
            aria-label="Maestro de ${etiqueta}" autocomplete="off"${s === B.salones()[0] ? ' data-primero' : ''}></td>
          <td class="celda-tenue">${N.plural(cuantos, 'alumno')}</td></tr>`;
      }).join('');
      const cuerpo = `<form class="dialogo-cuerpo" data-formulario="maestros" novalidate>
        <p class="dialogo-texto">El maestro se asigna una vez por salón y todos sus alumnos lo heredan. Al empezar otro ciclo escolar se corrige aquí.</p>
        <div class="tabla-dialogo-marco"><table class="tabla-dialogo tabla-maestros"><thead><tr><th scope="col">Salón</th>
          <th scope="col">Maestro de grupo</th><th scope="col">Alumnos</th></tr></thead><tbody>${filas}</tbody></table></div>
        ${pie('Guardar')}</form>`;
      return marco({ titulo: 'Maestros de grupo', cuerpo, ancho: 620 });
    },

    empleado(d) {
      const c = d.campos;
      const esAdministrador = E.sesion.perfil === 'administrador';
      const esPropio = d.modo === 'cambio' && d.id === E.sesion.id;
      const bloqueado = !esAdministrador || esPropio;
      const ayudaPerfil = !esAdministrador ? 'Solo un administrador asigna o cambia perfiles de acceso.'
        : esPropio ? 'No puedes cambiar tu propio perfil de acceso.' : 'El administrador además puede cambiar perfiles de acceso.';
      const puestos = [{ valor: '', texto: 'Elige el puesto' }, ...N.PUESTOS.map(p => ({ valor: p, texto: p }))];
      const perfiles = [{ valor: 'bibliotecario', texto: 'Bibliotecario' }, { valor: 'administrador', texto: 'Administrador' }];
      const cuerpo = `<form class="dialogo-cuerpo" data-formulario="empleado" novalidate>${errores(d.errores)}
        <div class="rejilla">
          ${campo({ id: 'f-codigo', etiqueta: 'Código', nombre: 'codigo', valor: c.codigo, requerido: true, marcador: 'EMP-004' })}
          ${selector({ id: 'f-puesto', etiqueta: 'Puesto', nombre: 'puesto', valor: c.puesto, opciones: puestos, requerido: true })}
          ${campo({ id: 'f-nombre', etiqueta: 'Nombre', nombre: 'nombre', valor: c.nombre, requerido: true })}
          ${campo({ id: 'f-apellidos', etiqueta: 'Apellidos', nombre: 'apellidos', valor: c.apellidos, requerido: true })}
          ${selector({ id: 'f-perfil', etiqueta: 'Perfil en el sistema', nombre: 'perfil', valor: c.perfil, opciones: perfiles,
            requerido: true, bloqueado, ayuda: ayudaPerfil })}
          ${campo({ id: 'f-correo', etiqueta: 'Correo', nombre: 'correo', valor: c.correo, requerido: true, tipo: 'email',
            marcador: 'empleado@ejemplo.com', ayuda: 'Es con lo que inicia sesión.' })}
          ${campo({ id: 'f-telefono', etiqueta: 'Teléfono', nombre: 'telefono', valor: c.telefono, tipo: 'tel' })}
          ${campo({ id: 'f-colonia', etiqueta: 'Colonia', nombre: 'colonia', valor: c.colonia })}
          ${campo({ id: 'f-calle', etiqueta: 'Calle y número', nombre: 'calle', valor: c.calle, ancho: true })}
        </div>
        <p class="nota-campos">* Campos obligatorios. El correo es con lo que el empleado inicia sesión.</p>
        ${pie('Guardar')}</form>`;
      return marco({ titulo: d.modo === 'alta' ? 'Registrar empleado' : 'Modificar empleado', cuerpo, ancho: 680,
        subtitulo: d.modo === 'cambio' ? x(B.nombreCompleto(B.empleado(d.id))) : '' });
    }
  };

  // --------------------------------------------------------------- eventos
  // El doble clic se detecta a mano: el primer clic selecciona y repinta, y
  // el navegador ya no reconoce el segundo como parte del mismo elemento.
  let ultimoClic = { clave: '', momento: 0 };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-accion]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    const accion = ACCIONES[el.dataset.accion];
    if (!accion) return;
    e.preventDefault();
    if (el.dataset.doble) {
      const clave = `${el.dataset.tabla}:${el.dataset.id}`;
      const momento = Date.now();
      if (ultimoClic.clave === clave && momento - ultimoClic.momento < 450) {
        ultimoClic = { clave: '', momento: 0 };
        ACCIONES[el.dataset.doble](el, e);
        return;
      }
      ultimoClic = { clave, momento };
    }
    accion(el, e);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (E.alerta) { cerrarAlerta(); return; }
      if (E.dialogo) { cerrarDialogo(); return; }
    }
    const el = e.target.closest('[role="button"][data-accion], tr[data-accion]');
    if (el && e.target === el && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      el.click();
    }
  });

  document.addEventListener('input', e => {
    const el = e.target;
    // Buscar o filtrar cambia el resumen: el aviso anterior deja de aplicar.
    if (el.dataset.busqueda) { E.busqueda[el.dataset.busqueda] = el.value; E.aviso = null; render(); return; }
    if (el.dataset.busquedaDialogo) { E.dialogo[el.dataset.busquedaDialogo] = el.value; renderDialogo(); return; }
    if (E.dialogo && el.name) {
      if (E.dialogo.campos) E.dialogo.campos[el.name] = el.value;
      if (el.name === 'motivo') E.dialogo.motivo = el.value;
    }
    if (el.id === 'correo' && !E.sesion) E.login.correo = el.value;
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.cambio === 'salon-deudores') { E.salonDeudores = el.value; E.aviso = null; render(); return; }
    if (el.dataset.cambio === 'ver-bajas') { E.verBajas = el.checked; E.aviso = null; render(); return; }
    if (E.dialogo && E.dialogo.tipo === 'alumno' && (el.name === 'grado' || el.name === 'grupo')) {
      E.dialogo.campos[el.name] = el.value;
      renderDialogo();
    }
  });

  document.addEventListener('submit', e => {
    e.preventDefault();
    const formulario = FORMULARIOS[e.target.dataset.formulario];
    if (formulario) formulario(e.target);
  });

  render();
})();

</script>
</body>
</html>
