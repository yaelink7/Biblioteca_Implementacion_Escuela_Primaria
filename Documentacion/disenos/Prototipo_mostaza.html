/* Piezas comunes de los dos prototipos: botones, campos, chips y diálogos.
   Cada tema les da su color y su forma con las variables de :root. */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--fuente);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.texto-rojo{color:var(--rojo)}
.fuerte{font-weight:600}
.con-icono{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border:1px solid transparent;border-radius:var(--radio-control);background:transparent;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s,opacity .15s}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primario{background:var(--p);color:var(--sobre-p)}
.btn-primario:hover:not(:disabled){background:var(--p-hover)}
.btn-suave{background:var(--p-suave);color:var(--p-texto)}
.btn-suave:hover:not(:disabled){background:var(--p-medio)}
.btn-borde{background:var(--superficie);border-color:var(--borde-control);color:var(--texto)}
.btn-borde:hover:not(:disabled){background:var(--gris-claro)}
.btn-peligro{background:var(--rojo);color:#fff}
.btn-peligro:hover:not(:disabled){background:var(--rojo-hover)}
.btn-peligro-suave{background:var(--superficie);border-color:var(--rojo-borde);color:var(--rojo)}
.btn-peligro-suave:hover:not(:disabled){background:var(--rojo-fondo)}
.btn-grande{min-height:50px;padding:0 22px;font-size:15px}
.btn-ancho{width:100%}
.boton-icono{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;flex:none;border:0;border-radius:12px;background:transparent;color:var(--gris);cursor:pointer}
.boton-icono:hover{background:var(--gris-claro);color:var(--texto)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.35;white-space:nowrap}
.chip-largo{white-space:normal}
.chip-azul{background:var(--p-suave);color:var(--p-texto)}
.chip-rojo{background:var(--rojo-fondo);color:var(--rojo)}
.chip-ambar{background:var(--ambar-fondo);color:var(--ambar)}
.chip-gris{background:var(--gris-claro);color:var(--gris)}

/* Campos de formulario */
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo>label,.etiqueta-campo{font-size:13.5px;font-weight:600;color:var(--texto)}
.obligatorio{color:var(--rojo)}
.campo>input,.selector select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--borde-control);border-radius:var(--radio-control);background:var(--superficie);color:var(--texto);font-size:15px}
.campo>input::placeholder{color:var(--marcador)}
.campo>input:focus,.selector select:focus{outline:none;border-color:var(--foco);box-shadow:0 0 0 3px var(--anillo)}
.selector{position:relative;display:flex;align-items:center}
.selector select{appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer}
.selector .ico{position:absolute;right:12px;pointer-events:none;color:var(--tenue)}
.selector-bloqueado select{background:var(--gris-claro);color:var(--tenue);cursor:not-allowed}
.campo-ayuda{margin:0;font-size:12.5px;color:var(--tenue)}
.campo-ancho{grid-column:1/-1}
.dato-fijo{display:flex;align-items:center;gap:8px;margin:0;min-height:44px;padding:0 12px;border:1px dashed var(--borde-control);border-radius:var(--radio-control);font-size:14.5px}
.separador-campos{margin:4px 0 -4px;padding-top:14px;border-top:1px solid var(--borde);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue)}

/* Diálogos */
body.con-dialogo{overflow:hidden}
.capa-fondo{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;overflow-y:auto;padding:48px 16px;background:var(--velo)}
.capa-alerta{z-index:60;align-items:center}
.dialogo{width:100%;max-width:var(--ancho);margin:auto 0;background:var(--superficie);border-radius:var(--radio-dialogo);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);animation:aparecer .16s ease-out}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dialogo{animation:none}}
.dialogo-cabeza{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 24px 4px}
.dialogo-titulo{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.dialogo-subtitulo{margin:4px 0 0;font-size:14px;color:var(--tenue)}
.dialogo-cuerpo{display:flex;flex-direction:column;gap:18px;padding:14px 24px 22px}
.dialogo-texto{margin:0;font-size:15px}
.dialogo-nota{margin:0;font-size:13px;color:var(--tenue)}
.dialogo-pie{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding-top:4px}
.rejilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.nota-campos{margin:0;font-size:12.5px;color:var(--tenue)}
.errores{padding:12px 16px;border-radius:12px;background:var(--rojo-fondo);color:var(--rojo-oscuro)}
.errores-titulo{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-weight:700}
.errores ul{margin:0;padding-left:22px}
.errores li{margin:2px 0}
.error-linea{display:flex;align-items:center;gap:8px;margin:0;color:var(--rojo);font-weight:600;font-size:14px}
.error-bloque{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--rojo-fondo);color:var(--rojo-oscuro)}
.error-bloque div{display:flex;flex-direction:column;gap:2px}
.sugerencias{display:flex;flex-wrap:wrap;gap:8px;margin-top:-6px}
.sugerencia{min-height:36px;padding:0 14px;border:1px solid var(--borde-control);border-radius:999px;background:var(--superficie);font-size:13.5px;font-weight:600;cursor:pointer}
.sugerencia:hover{background:var(--gris-claro)}
.datos-dialogo{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:14.5px}
.datos-dialogo dt{color:var(--tenue)}
.datos-dialogo dd{margin:0;font-weight:600}

/* Registrar préstamo: dos búsquedas y un botón */
.busquedas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.busqueda-paso{display:flex;flex-direction:column;gap:10px;min-width:0}
.paso{margin:0;font-size:15px;font-weight:800}
.busqueda-dialogo{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border:1px solid var(--borde-control);border-radius:var(--radio-control);background:var(--superficie);color:var(--tenue)}
.busqueda-dialogo:focus-within{border-color:var(--foco);box-shadow:0 0 0 3px var(--anillo)}
.busqueda-dialogo input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;color:var(--texto)}
.opciones{display:flex;flex-direction:column;gap:4px;height:300px;overflow-y:auto;padding:4px;border:1px solid var(--borde);border-radius:var(--radio-control);background:var(--fondo-lista)}
.opcion{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:9px 12px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;cursor:pointer}
.opcion:hover{background:var(--superficie)}
.opcion[aria-pressed="true"]{background:var(--p-suave);border-color:var(--p-borde)}
.opcion-principal{font-weight:700;font-size:14.5px}
.opcion-detalle{font-size:13px;color:var(--tenue)}
.opcion-nota{color:var(--ambar);font-weight:600}
.opcion-agotado{color:var(--rojo);font-weight:600}
.opciones-vacio{margin:auto;padding:16px;color:var(--tenue);font-size:14px;text-align:center}
.cierre-prestamo{display:flex;flex-direction:column;gap:8px;min-height:52px}
.resumen-prestamo{margin:0;font-size:15.5px}
.plazo-prestamo{margin:0;font-size:13.5px;color:var(--tenue)}

/* Alerta de error, como los cuadros de la app */
.dialogo-alerta{padding:26px 26px 22px}
.alerta-icono{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;border-radius:50%;background:var(--rojo-fondo);color:var(--rojo)}
.alerta-texto{margin:10px 0 6px;font-size:15px}
.alerta-texto strong{display:block;margin-bottom:4px}
.enlace-detalle{padding:6px 0;border:0;background:none;color:var(--p-texto);font-size:13.5px;font-weight:700;text-decoration:underline;cursor:pointer}
.alerta-detalle{margin:6px 0 0;padding:10px 12px;border-radius:10px;background:var(--gris-claro);font-family:Consolas,'IBM Plex Mono',monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-word;color:var(--gris)}
.dialogo-alerta .dialogo-pie{padding-top:16px}

/* Tablas dentro de los diálogos */
.tabla-dialogo-marco{max-height:340px;overflow:auto;border:1px solid var(--borde);border-radius:12px}
.tabla-dialogo{width:100%;border-collapse:collapse;font-size:14px}
.tabla-dialogo thead th{position:sticky;top:0;padding:10px 12px;background:var(--fondo-lista);text-align:left;font-size:12.5px;font-weight:700;color:var(--tenue);border-bottom:1px solid var(--borde)}
.tabla-dialogo td,.tabla-dialogo tbody th{padding:9px 12px;border-bottom:1px solid var(--borde);text-align:left}
.tabla-dialogo tbody tr:last-child td,.tabla-dialogo tbody tr:last-child th{border-bottom:0}
.tabla-maestros input{width:100%;min-height:38px;padding:0 10px;border:1px solid var(--borde-control);border-radius:8px;background:var(--superficie);font-size:14.5px}
.tabla-maestros input:focus{outline:none;border-color:var(--foco);box-shadow:0 0 0 3px var(--anillo)}
.celda-tenue{color:var(--tenue);white-space:nowrap}

/* Vacíos y pistas */
.vacio{display:flex;align-items:center;gap:10px;padding:28px;border:1px dashed var(--borde-control);border-radius:var(--radio-tarjeta);color:var(--tenue);font-size:15px}
.pista{display:flex;align-items:center;gap:8px;margin:0;font-size:13.5px;color:var(--tenue)}

/* Propuesta D · Lápiz: mostaza sobre grafito. El mostaza solo marca lo activo y
   el botón principal; el rojo queda para lo urgente. */
:root{
  --fuente:Manrope,'Segoe UI',system-ui,sans-serif;
  --fondo:#F6F5F1;--superficie:#FFFFFF;--texto:#1E2023;--tenue:#62666D;--gris:#4A4E55;--gris-claro:#F1F0EC;
  --borde:#E4E2DC;--borde-control:#D9D6CE;--marcador:#80848B;--fondo-lista:#FAF9F6;
  --p:#E0A526;--p-hover:#D3981A;--p-suave:#F9EFD8;--p-tenue:#FCF7EA;--p-medio:#F2DDA9;--p-borde:#E9C878;--p-texto:#755C24;--sobre-p:#1E2023;
  --foco:#755C24;--anillo:#F3DBA8;
  --rojo:#A3261B;--rojo-hover:#8A2016;--rojo-oscuro:#8F2318;--rojo-fondo:#FBEAE7;--rojo-borde:#EFC9C3;
  --ambar:#7A4A00;--ambar-fondo:#FBF0DA;

    ];

    const libro = (id, titulo, autor, coleccion, asignatura, editorial, existencias, ano, paginas) =>
      ({ id, titulo, autor, coleccion, asignatura, editorial, existencias, ano, paginas, activo: true,
        motivoBaja: '', fechaBaja: null });
    const libros = [
      libro(101, 'Alicia en el país de las maravillas', 'Lewis Carroll', 'Espejo de Urania', 'Español', 'Anaya', 1, 2015, 192),
      libro(102, 'Charlie y la fábrica de chocolate', 'Roald Dahl', 'Espejo de Urania', 'Español', 'Loqueleo', 2, 2016, 208),
      libro(103, 'Cuentos de la selva', 'Horacio Quiroga', 'Astrolabio', 'Ciencias Naturales', 'Porrúa', 1, 2012, 120),
      libro(104, 'Donde viven los monstruos', 'Maurice Sendak', 'Al sol solito', 'Español', 'Alfaguara', 0, 2014, 48),
      libro(105, 'El gato con botas', 'Charles Perrault', 'Pasos de luna', 'Español', 'Everest', 2, 2011, 32),
      libro(106, 'El patito feo', 'Hans Christian Andersen', 'Pasos de luna', 'Formación Cívica y Ética', 'Combel', 3, 2013, 32),
      libro(107, 'El principito', 'Antoine de Saint-Exupéry', 'Astrolabio', 'Formación Cívica y Ética', 'Salamandra', 2, 2019, 96),
      libro(108, 'El túnel', 'Anthony Browne', 'Astrolabio', 'Artes', 'Fondo de Cultura Económica', 2, 2018, 32),
      libro(109, 'Fábulas de Esopo', 'Esopo', 'Pasos de luna', 'Formación Cívica y Ética', 'Vicens Vives', 4, 2009, 160),
      libro(110, 'La oruga muy hambrienta', 'Eric Carle', 'Al sol solito', 'Ciencias Naturales', 'Kókinos', 1, 2017, 26),
      libro(111, 'La vuelta al mundo en 80 días', 'Julio Verne', 'Espejo de Urania', 'Geografía', 'Porrúa', 1, 2010, 256),
      libro(112, 'Las aventuras de Tom Sawyer', 'Mark Twain', 'Espejo de Urania', 'Español', 'Porrúa', 2, 2012, 288),
      libro(113, 'Matilda', 'Roald Dahl', 'Espejo de Urania', 'Español', 'Loqueleo', 0, 2016, 240),
      libro(114, 'Pinocho', 'Carlo Collodi', 'Astrolabio', 'Formación Cívica y Ética', 'Everest', 1, 2014, 224),
      Object.assign(libro(115, 'Los tres cerditos', 'Anónimo', 'Al sol solito', '', 'Combel', 0, 2008, 24),
        { activo: false, motivoBaja: 'Deterioro', fechaBaja: relativo(-60) })
    ];

    const prestamos = [];
    let siguiente = 1;
    const deAlumno = codigo => alumnos.find(a => a.codigo === codigo).id;
    const deLibro = titulo => libros.find(l => l.titulo === titulo).id;
    const prestamo = (codigo, titulo, desde, devuelto = null, registro = 1) => {
      const inicio = relativo(desde);
      prestamos.push({
        id: siguiente++, alumnoId: deAlumno(codigo), libroId: deLibro(titulo), registradoPor: registro,
        fechaPrestamo: inicio, fechaLimite: sumarDias(inicio, DIAS_DE_PRESTAMO),
        fechaDevolucion: devuelto === null ? null : relativo(devuelto),
        estado: devuelto === null ? 'activo' : 'devuelto'
      });
    };
    // Historial ya devuelto
    prestamo('A-0070', 'Las aventuras de Tom Sawyer', -50, -44);
    prestamo('A-0087', 'La vuelta al mundo en 80 días', -45, -39, 2);
    prestamo('A-0142', 'El patito feo', -40, -35);
    prestamo('A-0089', 'Charlie y la fábrica de chocolate', -35, -29);
    prestamo('A-0104', 'Matilda', -30, -25, 2);
    prestamo('A-0119', 'Pinocho', -28, -18);
    prestamo('A-0098', 'El túnel', -26, -20);
    prestamo('A-0073', 'Alicia en el país de las maravillas', -21, -15);
    // Préstamos en curso: dos vencidos, tres por vencer y el resto a tiempo
    prestamo('A-0142', 'Donde viven los monstruos', -14);
    prestamo('A-0119', 'La oruga muy hambrienta', -11, null, 2);
    prestamo('A-0104', 'El principito', -7);
    prestamo('A-0098', 'Las aventuras de Tom Sawyer', -5);
    prestamo('A-0087', 'Charlie y la fábrica de chocolate', -4, null, 2);
    prestamo('A-0131', 'El patito feo', -3);
    prestamo('A-0112', 'Cuentos de la selva', -3);
    prestamo('A-0137', 'Alicia en el país de las maravillas', -2, null, 2);
    prestamo('A-0073', 'Matilda', -1);
    prestamo('A-0158', 'El gato con botas', -1);
    prestamo('A-0092', 'Pinocho', 0, null, 2);
    prestamo('A-0066', 'La vuelta al mundo en 80 días', 0);

    // Maestro de grupo por salón (USU-09): se asigna una vez y lo heredan sus alumnos.
    const maestros = {
      '1A': 'Mtra. Laura Méndez', '1B': 'Mtro. Raúl Ortega', '2A': 'Mtra. Sofía Herrera',
      '2B': 'Mtra. Patricia Lara', '3A': 'Mtra. Gabriela Torres', '3B': 'Mtro. Andrés Vidal',
      '4A': 'Mtra. Rocío Campos', '4B': 'Mtro. Felipe Navarro', '5A': 'Mtra. Irma Castillo',
      '5B': 'Mtro. Jesús Aguirre', '6A': 'Mtra. Elena Rosas', '6B': ''
    };

    return { empleados, alumnos, libros, prestamos, maestros,
      siguiente: { libro: 200, alumno: 100, empleado: 10, prestamo: 100 } };
  }

  // ------------------------------------------------------- validaciones
  // Las mismas que servicios/validador_libro.py y validador_persona.py, más
  // las de los campos que pidió la escuela (CURP y teléfono del tutor).
  const PATRON_CORREO = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  const PATRON_CURP = /^[A-Z][AEIOUX][A-Z]{2}\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])[HM](AS|BC|BS|CC|CL|CM|CS|CH|DF|DG|GT|GR|HG|JC|MC|MN|MS|NT|NL|OC|PL|QT|QR|SP|SL|SR|TC|TS|TL|VZ|YN|ZS|NE)[B-DF-HJ-NP-TV-Z]{3}[A-Z\d]\d$/;

  function validarLibro(c, esAlta) {
    const e = [];
    if (!c.titulo) e.push('El título es obligatorio.');
    if (!c.autor) e.push('El autor es obligatorio.');
    if (c.existencias === null) e.push('Indica cuántos ejemplares hay.');
    else if (c.existencias < 0) e.push('Las existencias no pueden ser negativas.');
    else if (esAlta && c.existencias < 1) e.push('Un libro nuevo debe registrarse con al menos un ejemplar.');
    if (c.paginas !== null && c.paginas <= 0) e.push('El número de páginas debe ser mayor que cero.');
    if (c.ano !== null) {
      const actual = hoy.getFullYear();
      if (c.ano > actual) e.push(`El año de publicación no puede ser futuro (el año actual es ${actual}).`);
      else if (c.ano < ANO_MINIMO) e.push(`El año de publicación debe ser posterior a ${ANO_MINIMO}.`);
    }
    return e;
  }

  function validarPersona(c) {
    const e = [];
    if (!c.codigo) e.push('El código es obligatorio.');
    if (!c.nombre) e.push('El nombre es obligatorio.');
    if (!c.apellidos) e.push('Los apellidos son obligatorios.');
    if (c.telefono && c.telefono.replace(/\D/g, '').length < 7) e.push('El teléfono parece incompleto.');
    return e;
  }

  function validarAlumno(c) {
    const e = validarPersona(c);
    if (c.curp && !PATRON_CURP.test(c.curp)) {
      e.push('La CURP no tiene el formato oficial: son 18 caracteres, como CURV200412MVZRMLA4.');
    }
    if ((c.grado && !c.grupo) || (!c.grado && c.grupo)) e.push('Indica el grado y el grupo juntos, o deja ambos sin asignar.');
    if (!c.telefono) e.push('Registra el teléfono del tutor: sin él no hay forma de avisar de un préstamo vencido.');
    return e;
  }

  function validarEmpleado(c) {
    const e = validarPersona(c);
    if (!c.puesto) e.push('Indica el tipo de empleado.');
    if (!c.correo) e.push('El correo es obligatorio para el personal: es con lo que inicia sesión en el sistema.');
    else if (!PATRON_CORREO.test(c.correo)) e.push('El correo electrónico no tiene un formato válido.');
    return e;
  }

  // -------------------------------------------- consultas y reglas
  function crear(datos) {
    const alumno = id => datos.alumnos.find(a => a.id === id);
    const libro = id => datos.libros.find(l => l.id === id);
    const empleado = id => datos.empleados.find(e => e.id === id);
    const prestamo = id => datos.prestamos.find(p => p.id === id);
    const activos = () => datos.prestamos.filter(p => p.estado === 'activo');
    const prestamoActivoDe = alumnoId => activos().find(p => p.alumnoId === alumnoId);

    const nombreCompleto = p => `${p.nombre} ${p.apellidos}`.trim();
    const nombreCorto = p => `${p.nombre} ${(p.apellidos || '').split(' ')[0]}`.trim();
    const iniciales = p => `${p.nombre.charAt(0)}${(p.apellidos || '').charAt(0)}`.toUpperCase();
    const claveSalon = a => (a.grado && a.grupo ? `${a.grado}${a.grupo}` : '');
    const salon = a => (a.grado && a.grupo ? `${a.grado}.º ${a.grupo}` : 'Sin salón');
    const maestroDe = a => datos.maestros[claveSalon(a)] || '';
    const coleccion = nombre => COLECCIONES.find(c => c.nombre === nombre);

    function situacion(p) {
      if (p.estado === 'devuelto') return { tipo: 'devuelto', dias: 0, texto: 'Devuelto', corto: 'Devuelto' };
      const dias = diasEntre(p.fechaLimite, hoy);
      if (dias < 0) {
        return { tipo: 'vencido', dias: -dias, texto: `Vencido hace ${plural(-dias, 'día')}`,
          corto: `Vencido · ${plural(-dias, 'día')}` };
      }
      if (dias === 0) return { tipo: 'pronto', dias: 0, texto: 'Vence hoy', corto: 'Vence hoy' };
      return { tipo: dias <= DIAS_POR_VENCER ? 'pronto' : 'tiempo', dias, texto: `Vence en ${plural(dias, 'día')}`,
        corto: `Quedan ${plural(dias, 'día')}` };
    }

    const transcurridos = p => Math.min(DIAS_DE_PRESTAMO, Math.max(0, diasEntre(hoy, p.fechaPrestamo)));
    const estadoLibro = l => (!l.activo ? `Baja: ${l.motivoBaja || 'sin motivo'}`
      : l.existencias === 0 ? 'Sin ejemplares' : plural(l.existencias, 'disponible'));

    const coincide = (texto, ...campos) => {
      const t = sinAcentos(texto).trim();
      return !t || campos.some(c => sinAcentos(c).includes(t));
    };
    const coincideSalon = (texto, a) => {
      const t = soloSalon(texto);
      return t.length >= 2 && t.length <= 3 && t === claveSalon(a).toLowerCase();
    };

    function librosVisibles(texto, verBajas) {
      return datos.libros
        .filter(l => (verBajas || l.activo) && coincide(texto, l.titulo, l.autor, l.coleccion, l.asignatura, l.editorial));
    }
    function resumenCatalogo(lista, buscando) {
      if (buscando) return plural(lista.length, 'resultado');
      const activosLista = lista.filter(l => l.activo);
      const ejemplares = activosLista.reduce((s, l) => s + l.existencias, 0);
      const disponibles = activosLista.filter(l => l.existencias > 0).length;
      return `${plural(lista.length, 'título')} · ${ejemplares} ejemplares · ${disponibles} con disponibilidad`;
    }

    function prestamosVisibles(texto, vista) {
      return activos()
        .filter(p => {
          const a = alumno(p.alumnoId);
          const l = libro(p.libroId);
          return coincide(texto, nombreCompleto(a), a.codigo, l.titulo, l.autor) || coincideSalon(texto, a);
        })
        .filter(p => {
          const s = situacion(p);
          return vista === 'pronto' ? s.tipo === 'pronto' : vista === 'vencidos' ? s.tipo === 'vencido' : true;
        });
    }
    function conteoPrestamos() {
      const lista = activos().map(situacion);
      return { todos: lista.length, pronto: lista.filter(s => s.tipo === 'pronto').length,
        vencidos: lista.filter(s => s.tipo === 'vencido').length };
    }

    function alumnosVisibles(texto) {
      return datos.alumnos.filter(a => a.activo &&
        (coincide(texto, nombreCompleto(a), a.codigo, a.curp) || coincideSalon(texto, a)));
    }
    function resumenAlumnos(lista) {
      const conLibro = lista.filter(a => prestamoActivoDe(a.id)).length;
      const sinContacto = lista.filter(a => !a.telefono).length;
      const partes = [plural(lista.length, 'alumno')];
      if (conLibro) partes.push(`${conLibro} con libro prestado`);
      if (sinContacto) partes.push(`${sinContacto} sin contacto del tutor`);
      return partes.join(' · ');
    }

    function deudores(salonElegido) {
      return activos()
        .map(p => ({ prestamo: p, alumno: alumno(p.alumnoId), libro: libro(p.libroId), situacion: situacion(p) }))
        .filter(d => d.situacion.tipo === 'vencido')
        .filter(d => !salonElegido || salonElegido === 'Todos' || salon(d.alumno) === salonElegido)
        .sort((a, b) => b.situacion.dias - a.situacion.dias);
    }

    function historialDe(alumnoId) {
      return datos.prestamos.filter(p => p.alumnoId === alumnoId).sort((a, b) => b.fechaPrestamo - a.fechaPrestamo);
    }

    function salones() {
      const claves = new Set(Object.keys(datos.maestros));
      datos.alumnos.forEach(a => { if (claveSalon(a)) claves.add(claveSalon(a)); });
      return [...claves].sort();
    }

    // ------------------------------------------------------------- reglas
    const codigoOcupado = (codigo, propio) => [...datos.alumnos, ...datos.empleados]
      .some(p => p !== propio && sinAcentos(p.codigo) === sinAcentos(codigo));

    function revisarAnoEnLaBase(ano) {
      if (ano !== null && ano > hoy.getFullYear()) {
        throw new ErrorDeLaBase('El año de publicación no puede ser futuro.', 'Corrige el año y vuelve a guardar.',
          `P0001: el año de publicación ${ano} no puede ser futuro`);
      }
    }

    function registrarLibro(c) {
      revisarAnoEnLaBase(c.ano);
      const nuevo = Object.assign({ id: datos.siguiente.libro++, activo: true, motivoBaja: '', fechaBaja: null }, c);
      datos.libros.push(nuevo);
      return nuevo;
    }

    function modificarLibro(id, c) {
      revisarAnoEnLaBase(c.ano);
      if (c.existencias < 0) {
        throw new ErrorDeLaBase('El movimiento dejaría el inventario en negativo.',
          'Revisa cuántos ejemplares hay registrados de este libro.',
          'new row for relation "libros" violates check constraint "libros_existencias_check"');
      }
      return Object.assign(libro(id), c);
    }

    function darDeBaja(id, motivo) {
      const l = libro(id);
      if (!motivo.trim()) {
        throw new ErrorDeLaBase('Falta indicar el motivo de la baja.', 'Escribe por qué se da de baja el libro y vuelve a guardar.',
          'new row for relation "libros" violates check constraint "baja_con_motivo"');
      }
      const prestados = activos().filter(p => p.libroId === id).length;
      if (prestados) {
        throw new ErrorDeLaBase('El libro tiene ejemplares prestados.',
          'No se puede dar de baja hasta que regresen. Revísalos en Préstamos.',
          `P0001: el libro ${id} tiene ${plural(prestados, 'ejemplar', 'ejemplares')} sin devolver`);
      }
      Object.assign(l, { activo: false, motivoBaja: motivo.trim(), fechaBaja: hoy });
      return l;
    }

    function registrarPrestamo(alumnoId, libroId, registradoPor) {
      const a = alumno(alumnoId);
      const l = libro(libroId);
      if (!a || !l) {
        throw new ErrorDeLaBase('El registro al que haces referencia no existe.',
          'Puede que alguien lo haya dado de baja. Actualiza la pantalla.',
          'insert or update on table "prestamos" violates foreign key constraint');
      }
      if (!l.activo) {
        throw new ErrorDeLaBase('Ese libro está dado de baja del acervo.', 'No se puede prestar mientras siga dado de baja.',
          `P0001: el libro ${l.id} esta dado de baja del acervo`);
      }
      if (prestamoActivoDe(a.id)) {
        throw new ErrorDeLaBase('Este alumno ya tiene un préstamo activo.',
          'Solo se permite un libro por alumno. Registra primero la devolución.',
          'duplicate key value violates unique constraint "prestamo_unico_activo_por_usuario"');
      }
      if (l.existencias <= 0) {
        throw new ErrorDeLaBase('No quedan ejemplares disponibles de este libro.',
          'Espera a que alguien devuelva uno, o revisa las existencias en el catálogo.',
          `P0001: no hay ejemplares disponibles del libro ${l.id}`);
      }
      // calcular_fecha_limite y mover_inventario: los hace la base, no la pantalla.
      l.existencias -= 1;
      const nuevo = { id: datos.siguiente.prestamo++, alumnoId, libroId, registradoPor, fechaPrestamo: hoy,
        fechaLimite: sumarDias(hoy, DIAS_DE_PRESTAMO), fechaDevolucion: null, estado: 'activo' };
      datos.prestamos.push(nuevo);
      return nuevo;
    }

    function devolver(id) {
      const p = prestamo(id);
      if (!p || p.estado !== 'activo') return p;
      // sellar_devolucion pone la fecha; mover_inventario reintegra la unidad.
      Object.assign(p, { estado: 'devuelto', fechaDevolucion: hoy });
      libro(p.libroId).existencias += 1;
      return p;
    }

    function revisarPersona(c, propio) {
      if (codigoOcupado(c.codigo, propio)) {
        throw new ErrorDeLaBase('Ya existe una persona registrada con ese código.',
          'Usa un código distinto: el sistema no admite dos iguales.',
          'duplicate key value violates unique constraint "perfiles_codigo_key"');
      }
    }

    function revisarCurp(c, propio) {
      if (c.curp && datos.alumnos.some(a => a !== propio && a.curp === c.curp)) {
        throw new ErrorDeLaBase('Ya hay un alumno registrado con esa CURP.',
          'Revisa que esté bien escrita: la CURP es única para cada persona.',
          'duplicate key value violates unique constraint "usuarios_curp_key"');
      }
    }

    function registrarAlumno(c) {
      revisarPersona(c, null);
      revisarCurp(c, null);
      const nuevo = Object.assign({ id: datos.siguiente.alumno++, activo: true }, c);
      datos.alumnos.push(nuevo);
      return nuevo;
    }

    function modificarAlumno(id, c) {
      const a = alumno(id);
      revisarPersona(c, a);
      revisarCurp(c, a);
      return Object.assign(a, c);
    }

    function guardarMaestros(cambios) {
      Object.assign(datos.maestros, cambios);
    }

    function revisarCorreo(c, propio) {
      if (datos.empleados.some(e => e !== propio && sinAcentos(e.correo) === sinAcentos(c.correo))) {
        throw new ErrorDeLaBase('Ya existe una cuenta con ese correo.',
          'Cada persona inicia sesión con su propio correo. Usa uno distinto.',
          'AuthApiError: User already registered');
      }
    }

    function registrarEmpleado(c, sesion) {
      if (c.perfil === 'administrador' && sesion.perfil !== 'administrador') {
        throw new ErrorDeLaBase('Solo un administrador puede registrar a otro administrador.',
          'Regístralo como bibliotecario, o pídele a un administrador que lo registre.',
          'P0001: Solo un administrador puede registrar a otro administrador.');
      }
      revisarPersona(c, null);
      revisarCorreo(c, null);
      const nuevo = Object.assign({ id: datos.siguiente.empleado++, ingreso: hoy }, c);
      datos.empleados.push(nuevo);
      return nuevo;
    }

    function modificarEmpleado(id, c, sesion) {
      const e = empleado(id);
      if (c.perfil !== e.perfil) {
        if (sesion.perfil !== 'administrador') {
          throw new ErrorDeLaBase('Solo un administrador cambia el perfil de acceso de alguien.',
            'Pídele a un administrador que haga el cambio.', 'P0001: solo un administrador puede cambiar el perfil de acceso');
        }
        if (id === sesion.id) {
          throw new ErrorDeLaBase('No puedes cambiar tu propio perfil de acceso.', 'Pídeselo a un administrador.',
            'P0001: no puedes cambiar tu propio perfil de acceso');
        }
      }
      revisarPersona(c, e);
      revisarCorreo(c, e);
      return Object.assign(e, c);
    }

    function iniciarSesion(correo) {
      const e = datos.empleados.find(x => sinAcentos(x.correo) === sinAcentos(correo.trim()));
      if (!e) {
        throw new ErrorDeLaBase('Correo o contraseña incorrectos.',
          'Revisa que el correo esté bien escrito y vuelve a intentarlo.', 'AuthApiError: Invalid login credentials');
      }
      return e;
    }

    return {
      datos, alumno, libro, empleado, prestamo, activos, prestamoActivoDe, nombreCompleto, nombreCorto, iniciales,
      claveSalon, salon, maestroDe, coleccion, situacion, transcurridos, estadoLibro, librosVisibles,
      resumenCatalogo, prestamosVisibles, conteoPrestamos, alumnosVisibles, resumenAlumnos, deudores, historialDe,
      salones, registrarLibro, modificarLibro, darDeBaja, registrarPrestamo, devolver, registrarAlumno,
      modificarAlumno, guardarMaestros, registrarEmpleado, modificarEmpleado, iniciarSesion
    };
  }

  return {
    DIAS_DE_PRESTAMO, DIAS_CRITICOS, DIAS_POR_VENCER, COLECCIONES, ASIGNATURAS, PUESTOS, GRUPOS,
    hoy, fecha, sinAcentos, escapar, plural, mayuscula, ErrorDeLaBase, datosIniciales,
    validarLibro, validarAlumno, validarEmpleado, crear
  };
})();

</script>
<script>
/* Iconos de Lucide (licencia ISC), los mismos de las maquetas. */
'use strict';

const Iconos = (() => {
  const TRAZOS = {
    catalogo: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
    prestamos: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
    alumnos: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    deudores: '<path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>',
    empleados: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    buscar: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    mas: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    salir: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
    telefono: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
    correo: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    alerta: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
    escudo: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
    actualizar: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    editar: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
    historial: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
    baja: '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="m9.5 17 5-5"/><path d="m9.5 12 5 5"/>',
    abajo: '<path d="m6 9 6 6 6-6"/>',
    arriba: '<path d="m18 15-6-6-6 6"/>',
    ordenar: '<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>',
    cerrar: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    devolver: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/>',
    reloj: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    listo: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    candado: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    maestro: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
    flecha: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    lugar: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
    credencial: '<path d="M16 10h2"/><path d="M16 14h2"/><path d="M6.17 15a3 3 0 0 1 5.66 0"/><circle cx="9" cy="11" r="2"/><rect x="2" y="5" width="20" height="14" rx="2"/>'
  };

  function svg(nombre, tam = 18, clase = '') {
    const medida = tam === 18 ? '' : ` style="width:${tam}px;height:${tam}px"`;
    return `<svg class="ico${clase ? ' ' + clase : ''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"${medida}>${TRAZOS[nombre]}</svg>`;
  }

  return { svg };
})();

</script>
<script>
/* Propuesta D · Lápiz (mostaza y grafito). Solo dibuja: el controlador decide
   qué pasa con cada botón. Todas las pestañas son una tabla con el detalle de
   la fila elegida a la derecha; Deudores es una hoja de reporte. */
'use strict';

const Tema = (() => {
  const ESCUELA = 'Esc. Prim. Adalberto Tejeda';
  const SECCIONES = [['catalogo', 'Catálogo'], ['prestamos', 'Préstamos'], ['alumnos', 'Alumnos'],
    ['deudores', 'Deudores'], ['empleados', 'Empleados']];
  const ico = (n, t) => Iconos.svg(n, t);

  const inicial = titulo => {
    const palabras = titulo.split(' ');
    const articulo = ['El', 'La', 'Las', 'Los', 'Un', 'Una'].includes(palabras[0]) && palabras.length > 1;
    return (articulo ? palabras[1] : palabras[0]).charAt(0).toUpperCase();
  };

  const boton = (texto, icono, { id = '', clase = 'btn-borde', accion = '', deshabilitado = false, datos = '' } = {}) =>
    `<button type="button"${id ? ` id="${id}"` : ''} class="btn ${clase}"${accion ? ` data-accion="${accion}"` : ''}${deshabilitado ? ' disabled' : ''}${datos}>${icono ? ico(icono, 16) : ''}${texto}</button>`;

  const busqueda = (ctx, clave, etiqueta, marcador) => `<label for="buscar-${clave}" class="sr">${etiqueta}</label>
    <div class="campo-busqueda">${ico('buscar')}<input id="buscar-${clave}" type="search" placeholder="${marcador}"
      value="${ctx.x(ctx.E.busqueda[clave])}" data-busqueda="${clave}" autocomplete="off"></div>`;

  const encabezado = (ctx, pantalla, titulo, resumen, acciones) => {
    const aviso = ctx.avisoDe(pantalla);
    return `<div class="encabezado"><div class="encabezado-texto">
        <h1 class="titulo" id="titulo-pantalla" tabindex="-1">${titulo}</h1>
        <p class="resumen${aviso ? ' resumen-aviso' : ' mono'}" role="status">${aviso ? ico('listo', 16) + ctx.x(aviso) : resumen}</p></div>
      <div class="acciones">${acciones}</div></div>`;
  };

  const panel = (etiqueta, contenido) =>
    `<aside class="panel" aria-label="${etiqueta}"><span class="panel-etiqueta mono">${etiqueta}</span>${contenido}</aside>`;
  const panelVacio = (etiqueta, texto) => panel(etiqueta, `<p class="panel-vacio">${ico('info', 18)}${texto}</p>`);
  const datos = pares => `<dl class="datos">${pares.map(([termino, valor, mono]) =>
    `<dt>${termino}</dt><dd${mono ? ' class="mono"' : ''}>${valor}</dd>`).join('')}</dl>`;
  const persona = (iniciales, nombre, detalle) => `<div class="persona-panel"><span class="avatar" aria-hidden="true">${iniciales}</span>
    <div><span class="persona-panel-nombre">${nombre}</span><span class="persona-panel-detalle">${detalle}</span></div></div>`;
  const acciones = (...botones) => `<div class="panel-acciones">${botones.join('')}</div>`;
  const vacio = texto => `<p class="vacio-tabla">${texto}</p>`;
  const rojo = (texto, punto = true) => `<span class="estado-rojo">${punto ? '<span class="punto" aria-hidden="true"></span>' : ''}${texto}</span>`;

  function cabecera(ctx, tabla, col, texto) {
    const orden = ctx.E.orden[tabla];
    const activo = orden.col === col;
    const sentido = activo ? (orden.asc ? 'ascending' : 'descending') : 'none';
    const flecha = activo ? (orden.asc ? 'arriba' : 'abajo') : 'ordenar';
    return `<th scope="col" aria-sort="${sentido}"><button type="button" class="ordenar${activo ? ' activo' : ''}"
      data-accion="ordenar" data-tabla="${tabla}" data-col="${col}">${texto}${ico(flecha, 13)}</button></th>`;
  }

  const fila = (tabla, id, celdas, { seleccionada = false, apagada = false, doble = '' } = {}) =>
    `<tr class="fila${seleccionada ? ' seleccionada' : ''}${apagada ? ' apagada' : ''}" tabindex="0" data-accion="seleccionar"
      data-tabla="${tabla}" data-id="${id}"${doble ? ` data-doble="${doble}"` : ''}>${celdas.join('')}</tr>`;
  const td = (html, clase = '') => `<td${clase ? ` class="${clase}"` : ''}>${html}</td>`;

  const tablaConPanel = (etiqueta, barra, cabeceras, filas, textoVacio, panelHtml) => `<div class="cuerpo">
      <section class="tabla-marco" aria-label="${etiqueta}">${barra}
        ${filas ? `<div class="tabla-desliza"><table class="tabla"><thead><tr>${cabeceras}</tr></thead><tbody>${filas}</tbody></table></div>`
          : vacio(textoVacio)}
      </section>${panelHtml}</div>`;

  // ------------------------------------------------------------ marco
  function riel(ctx) {
    const { E, B, x, sesion } = ctx;
    const deudores = B.deudores().length;
    const items = SECCIONES.map(([clave, texto]) => {
      const activo = E.pantalla === clave;
      const insignia = clave === 'deudores' && deudores ? `<span class="insignia">${deudores}</span>` : '';
      return `<button type="button" id="menu-${clave}" class="riel-item${activo ? ' activo' : ''}" data-accion="ir"
        data-pantalla="${clave}"${activo ? ' aria-current="page"' : ''}><span class="riel-pastilla">${ico(clave, 20)}${insignia}</span>${texto}</button>`;
    }).join('');
    return `<aside class="riel" aria-label="Navegación principal">
      <div class="logo" aria-hidden="true">LOGO</div>
      <nav class="riel-menu" aria-label="Secciones">${items}</nav>
      <div class="riel-usuario"><span class="avatar avatar-riel" title="${x(B.nombreCompleto(sesion))}" aria-hidden="true">${B.iniciales(sesion)}</span>
        <button type="button" id="boton-salir" class="boton-icono" data-accion="cerrar-sesion" aria-label="Cerrar sesión"
          title="Cerrar sesión">${ico('salir')}</button></div>
    </aside>`;
  }

  function app(ctx) {
    const { E, B, N, x, sesion } = ctx;
    return `<div class="app">${riel(ctx)}<main class="principal">
      <div class="linea-superior mono"><span>Biblioteca escolar · ${ESCUELA}</span>
        <span>${N.fecha.conAno(N.hoy)} · ${x(B.nombreCorto(sesion))} · ${sesion.perfil}</span></div>
      ${PANTALLAS[E.pantalla](ctx)}</main></div>`;
  }

  // ----------------------------------------------------------- catálogo
  function catalogo(ctx) {
    const { E, B, N, x } = ctx;
    const q = E.busqueda.catalogo;
    const lista = ctx.ordenar('catalogo', B.librosVisibles(q, E.verBajas), {
      titulo: l => l.titulo, autor: l => l.autor, coleccion: l => l.coleccion || 'zz', asignatura: l => l.asignatura || 'zz',
      estado: l => (l.activo ? -l.existencias : 1)
    });
    const elegido = lista.find(l => l.id === E.seleccion.catalogo);
    const filas = lista.map(l => {
      const estado = !l.activo ? `<em>${x(B.estadoLibro(l))}</em>` : l.existencias ? B.estadoLibro(l) : rojo('Sin ejemplares');
      return fila('catalogo', l.id, [td(x(l.titulo), 'fuerte'), td(x(l.autor)), td(x(l.coleccion || '—')), td(x(l.asignatura || '—')), td(estado)],
        { seleccionada: elegido && elegido.id === l.id, apagada: !l.activo, doble: l.activo ? 'modificar-libro' : '' });
    }).join('');
    const barra = `<div class="tabla-barra"><label class="casilla"><input type="checkbox" data-cambio="ver-bajas"${E.verBajas ? ' checked' : ''}>
      Ver dados de baja</label><span class="mono tenue">Doble clic para modificar</span></div>`;
    let detalle = panelVacio('Libro seleccionado', 'Elige un libro de la tabla para ver su ficha.');
    if (elegido) {
      const coleccion = B.coleccion(elegido.coleccion);
      detalle = panel('Libro seleccionado', `<div class="ficha-libro"><span class="portada" aria-hidden="true">${inicial(elegido.titulo)}</span>
          <div><span class="persona-panel-nombre">${x(elegido.titulo)}</span><span class="persona-panel-detalle">${x(elegido.autor)}</span></div></div>
        ${elegido.activo ? '' : `<div class="caja-gris">${ico('baja', 18)}<div><strong>Dado de baja</strong><span>${x(elegido.motivoBaja)} · ${N.fecha.conAno(elegido.fechaBaja)}</span></div></div>`}
        ${datos([
          ['Colección', coleccion ? `${x(coleccion.nombre)}<span class="dd-sub">${coleccion.grados}</span>` : 'Sin colección'],
          ['Asignatura', x(elegido.asignatura || 'Sin asignatura')],
          ['Editorial', x(elegido.editorial || '—')],
          ['Año', elegido.ano || '—', true],
          ['Páginas', elegido.paginas || '—', true],
          ['Disponibles', elegido.activo ? N.plural(elegido.existencias, 'ejemplar', 'ejemplares') : '—', true]
        ])}
        ${acciones(boton('Modificar', 'editar', { id: 'boton-modificar-libro', clase: 'btn-primario btn-ancho', accion: 'modificar-libro', deshabilitado: !elegido.activo }),
          boton('Dar de baja', 'baja', { id: 'boton-baja-libro', clase: 'btn-peligro-suave btn-ancho', accion: 'baja-libro', deshabilitado: !elegido.activo }))}`);
    }
    return `${encabezado(ctx, 'catalogo', 'Catálogo', B.resumenCatalogo(lista, !!q.trim()),
        busqueda(ctx, 'catalogo', 'Buscar en el catálogo', 'Título, autor o colección')
        + boton('Registrar libro', 'mas', { id: 'boton-nuevo-libro', clase: 'btn-primario', accion: 'nuevo-libro' }))}
      ${tablaConPanel('Acervo', barra, cabecera(ctx, 'catalogo', 'titulo', 'Título') + cabecera(ctx, 'catalogo', 'autor', 'Autor')
        + cabecera(ctx, 'catalogo', 'coleccion', 'Colección') + cabecera(ctx, 'catalogo', 'asignatura', 'Asignatura')
        + cabecera(ctx, 'catalogo', 'estado', 'Estado'), filas, `No hay libros que coincidan con «${x(q)}».`, detalle)}`;
  }

  // ----------------------------------------------------------- préstamos
  function prestamos(ctx) {
    const { E, B, N, x } = ctx;
    const conteo = B.conteoPrestamos();
    const lista = ctx.ordenar('prestamos', B.prestamosVisibles(E.busqueda.prestamos, E.vistaPrestamos), {
      alumno: p => B.nombreCompleto(B.alumno(p.alumnoId)), salon: p => B.claveSalon(B.alumno(p.alumnoId)),
      libro: p => B.libro(p.libroId).titulo, vence: p => p.fechaLimite.getTime(), situacion: p => p.fechaLimite.getTime()
    });
    const elegido = lista.find(p => p.id === E.seleccion.prestamos);
    const resumen = `${conteo.todos} activos · ${conteo.pronto} por vencer · ${conteo.vencidos
      ? `<span class="texto-rojo">${N.plural(conteo.vencidos, 'vencido')}</span>` : 'ninguno vencido'}`;
    const pestanas = [['todos', 'Todos', conteo.todos], ['pronto', 'Por vencer', conteo.pronto], ['vencidos', 'Vencidos', conteo.vencidos]]
      .map(([vista, texto, n]) => `<button type="button" id="vista-${vista}" class="subpestana${E.vistaPrestamos === vista ? ' activa' : ''}"
        aria-pressed="${E.vistaPrestamos === vista}" data-accion="vista-prestamos" data-vista="${vista}">${texto}
        <span class="mono${vista === 'vencidos' && n ? ' texto-rojo' : ' tenue'}">${n}</span></button>`).join('');
    const filas = lista.map(p => {
      const alumno = B.alumno(p.alumnoId);
      const s = B.situacion(p);
      const situacion = s.tipo === 'vencido' ? rojo(s.corto) : s.tipo === 'pronto'
        ? `<span class="estado-fuerte">${ico('reloj', 15)}${s.dias === 0 ? 'Vence hoy' : `En ${N.plural(s.dias, 'día')}`}</span>`
        : `<span class="tenue">En ${N.plural(s.dias, 'día')}</span>`;
      return fila('prestamos', p.id, [td(x(B.nombreCompleto(alumno)), 'fuerte'), td(B.salon(alumno), 'mono'),
        td(x(B.libro(p.libroId).titulo)), td(N.fecha.corta(p.fechaLimite), 'mono'), td(situacion)], { seleccionada: elegido && elegido.id === p.id });
    }).join('');
    let detalle = panelVacio('Préstamo seleccionado', 'Elige un préstamo para ver su detalle y registrar la devolución.');
    if (elegido) {
      const alumno = B.alumno(elegido.alumnoId);
      const libro = B.libro(elegido.libroId);
      const s = B.situacion(elegido);
      const registro = B.empleado(elegido.registradoPor);
      const caja = s.tipo === 'vencido'
        ? `<div class="caja-roja">${ico('alerta', 18)}<div><strong>Venció hace ${N.plural(s.dias, 'día')}</strong><span>Ya aparece en el reporte de deudores.</span></div></div>`
        : `<div class="caja-gris">${ico('reloj', 18)}<div><strong>${s.texto}</strong><span>Plazo de ${N.DIAS_DE_PRESTAMO} días que calcula la base.</span></div></div>`;
      detalle = panel('Préstamo seleccionado', `${persona(B.iniciales(alumno), x(B.nombreCompleto(alumno)), `${B.salon(alumno)} · <span class="mono">${x(alumno.codigo)}</span>`)}
        ${caja}
        ${datos([
          ['Libro', `<strong>${x(libro.titulo)}</strong>`], ['Autor', x(libro.autor)],
          ['Prestado', N.fecha.conAno(elegido.fechaPrestamo), true], [s.tipo === 'vencido' ? 'Vencía' : 'Vence', N.fecha.conAno(elegido.fechaLimite), true],
          ['Registró', registro ? x(B.nombreCorto(registro)) : '—'],
          ['Tel. del tutor', alumno.telefono ? x(alumno.telefono) : '<span class="texto-rojo">Sin contacto</span>', !!alumno.telefono]
        ])}
        ${acciones(boton('Registrar devolución', 'devolver', { id: 'boton-devolver', clase: 'btn-primario btn-ancho', accion: 'devolver', datos: ` data-id="${elegido.id}"` }),
          boton('Ver historial del alumno', 'historial', { id: 'boton-historial-prestamo', clase: 'btn-borde btn-ancho', accion: 'historial', datos: ` data-id="${alumno.id}"` }))}`);
    }
    const sinResultados = E.busqueda.prestamos.trim() ? `Ningún préstamo coincide con «${x(E.busqueda.prestamos)}».`
      : E.vistaPrestamos === 'vencidos' ? 'No hay préstamos vencidos.' : E.vistaPrestamos === 'pronto'
        ? 'Ningún préstamo vence en los próximos tres días.' : 'No hay préstamos activos.';
    return `${encabezado(ctx, 'prestamos', 'Préstamos', resumen,
        busqueda(ctx, 'prestamos', 'Buscar préstamo', 'Alumno, libro o salón')
        + boton('Nuevo préstamo', 'mas', { id: 'boton-nuevo-prestamo', clase: 'btn-primario', accion: 'nuevo-prestamo' }))}
      ${tablaConPanel('Préstamos en curso', `<div class="tabla-barra subpestanas" role="group" aria-label="Mostrar préstamos">${pestanas}</div>`,
        cabecera(ctx, 'prestamos', 'alumno', 'Alumno') + cabecera(ctx, 'prestamos', 'salon', 'Grupo') + cabecera(ctx, 'prestamos', 'libro', 'Libro')
        + cabecera(ctx, 'prestamos', 'vence', 'Vence') + cabecera(ctx, 'prestamos', 'situacion', 'Situación'), filas, sinResultados, detalle)}`;
  }

  // ------------------------------------------------------------ alumnos
  function alumnos(ctx) {
    const { E, B, N, x } = ctx;
    const q = E.busqueda.alumnos;
    const lista = ctx.ordenar('alumnos', B.alumnosVisibles(q), {
      codigo: a => a.codigo, nombre: a => B.nombreCompleto(a), salon: a => B.claveSalon(a) || 'zz',
      contacto: a => (a.telefono ? 0 : 1), situacion: a => (B.prestamoActivoDe(a.id) ? 0 : 1)
    });
    const elegido = lista.find(a => a.id === E.seleccion.alumnos);
    const filas = lista.map(a => {
      const activo = B.prestamoActivoDe(a.id);
      const situacion = activo ? `<span class="${B.situacion(activo).tipo === 'vencido' ? 'texto-rojo fuerte' : ''}">Tiene «${x(B.libro(activo.libroId).titulo)}»</span>`
        : '<span class="tenue">Sin préstamos</span>';
      return fila('alumnos', a.id, [td(x(a.codigo), 'mono'), td(x(B.nombreCompleto(a)), 'fuerte'), td(B.salon(a), 'mono'),
        td(a.telefono ? x(a.telefono) : rojo('Sin contacto', false), a.telefono ? 'mono' : ''), td(situacion, 'envuelve')],
        { seleccionada: elegido && elegido.id === a.id, doble: 'modificar-alumno' });
    }).join('');
    let detalle = panelVacio('Alumno seleccionado', 'Elige un alumno para ver su ficha, su préstamo y su historial.');
    if (elegido) {
      const activo = B.prestamoActivoDe(elegido.id);
      let caja = `<div class="caja-gris">${ico('catalogo', 18)}<div><strong>Sin préstamos en curso</strong><span>Puede llevarse un libro.</span></div></div>`;
      if (activo) {
        const s = B.situacion(activo);
        const libro = B.libro(activo.libroId);
        caja = s.tipo === 'vencido'
          ? `<div class="caja-roja">${ico('alerta', 18)}<div><strong>Tiene «${x(libro.titulo)}»</strong><span>Vencido hace ${N.plural(s.dias, 'día')}; ya aparece en el reporte de deudores.</span></div></div>`
          : `<div class="caja-gris">${ico('reloj', 18)}<div><strong>Tiene «${x(libro.titulo)}»</strong><span>${s.texto}.</span></div></div>`;
      }
      const maestro = B.maestroDe(elegido);
      detalle = panel('Alumno seleccionado', `${persona(B.iniciales(elegido), x(B.nombreCompleto(elegido)), `${B.salon(elegido)} · <span class="mono">${x(elegido.codigo)}</span>`)}
        ${caja}
        ${datos([
          ['CURP', elegido.curp ? x(elegido.curp) : '—', true],
          ['Maestro', maestro ? x(maestro) : '<span class="tenue">Sin asignar</span>'],
          ['Tel. del tutor', elegido.telefono ? x(elegido.telefono) : '<span class="texto-rojo">Sin contacto</span>', !!elegido.telefono],
          ['Dirección', [elegido.calle, elegido.colonia].filter(Boolean).map(x).join(', ') || '—']
        ])}
        ${acciones(boton('Modificar', 'editar', { id: 'boton-modificar-alumno', clase: 'btn-primario btn-ancho', accion: 'modificar-alumno' }),
          boton('Ver historial', 'historial', { id: 'boton-historial', clase: 'btn-borde btn-ancho', accion: 'historial' }))}`);
    }
    return `${encabezado(ctx, 'alumnos', 'Alumnos', B.resumenAlumnos(lista),
        busqueda(ctx, 'alumnos', 'Buscar alumno', 'Nombre, código o salón (4B)')
        + boton('Maestros de grupo', 'maestro', { id: 'boton-maestros', accion: 'maestros' })
        + boton('Registrar alumno', 'mas', { id: 'boton-nuevo-alumno', clase: 'btn-primario', accion: 'nuevo-alumno' }))}
      ${tablaConPanel('Padrón de alumnos', '', cabecera(ctx, 'alumnos', 'codigo', 'Código') + cabecera(ctx, 'alumnos', 'nombre', 'Alumno')
        + cabecera(ctx, 'alumnos', 'salon', 'Salón') + cabecera(ctx, 'alumnos', 'contacto', 'Contacto del tutor')
        + cabecera(ctx, 'alumnos', 'situacion', 'Situación'), filas, `Nadie coincide con «${x(q)}».`, detalle)}`;
  }

  // ----------------------------------------------------------- deudores
  function deudores(ctx) {
    const { E, B, N, x } = ctx;
    const todos = B.deudores();
    const salones = [...new Set(todos.map(d => B.salon(d.alumno)))].sort();
    const elegido = salones.includes(E.salonDeudores) ? E.salonDeudores : 'Todos';
    const lista = B.deudores(elegido);
    const criticos = lista.filter(d => d.situacion.dias >= N.DIAS_CRITICOS).length;
    const opciones = ['Todos', ...salones].map(s => `<option${s === elegido ? ' selected' : ''}>${s}</option>`).join('');
    const controles = `<label for="salon-deudores" class="etiqueta-linea">Filtrar por salón</label>
      <div class="selector selector-linea"><select id="salon-deudores" data-cambio="salon-deudores">${opciones}</select>${ico('abajo', 16)}</div>
      ${boton('Actualizar', 'actualizar', { id: 'boton-actualizar', accion: 'actualizar-deudores' })}`;
    const filas = lista.map(d => {
      const critico = d.situacion.dias >= N.DIAS_CRITICOS;
      return `<tr><td class="fuerte">${x(B.nombreCompleto(d.alumno))}</td><td class="mono">${B.salon(d.alumno)}</td><td>${x(d.libro.titulo)}</td>
        <td class="mono">${N.fecha.numerica(d.prestamo.fechaLimite)}</td>
        <td class="mono ${critico ? 'texto-rojo' : ''} fuerte">${N.plural(d.situacion.dias, 'día')}</td>
        <td class="mono">${d.alumno.telefono ? x(d.alumno.telefono) : '<span class="texto-rojo">Sin contacto registrado</span>'}</td></tr>`;
    }).join('');
    const cabeza = lista.length
      ? `<div class="hoja-cifra"><span class="mono cifra-numero${criticos ? ' texto-rojo' : ''}">${lista.length}</span>
          <span class="cifra-texto">${lista.length === 1 ? 'alumno con adeudo' : 'alumnos con adeudo'}</span></div>
        <span class="hoja-peor">El más atrasado: <strong>${x(B.nombreCompleto(lista[0].alumno))}, ${N.plural(lista[0].situacion.dias, 'día')}</strong>${criticos
          ? ` · ${criticos} con más de ${N.DIAS_CRITICOS} días` : ''}</span>`
      : `<div class="hoja-cifra">${ico('listo', 26)}<span class="cifra-texto">Sin deudores</span></div>
        <span class="hoja-peor">Todos los préstamos están dentro de su plazo.</span>`;
    return `${encabezado(ctx, 'deudores', 'Deudores', `Generado el ${N.fecha.numerica(E.generado)} a las ${N.fecha.hora(E.generado)}`, controles)}
      <section class="hoja" aria-label="Reporte de deudores">
        <div class="hoja-franja" aria-hidden="true"></div>
        <div class="hoja-cabeza">${cabeza}</div>
        <div class="doble-raya" aria-hidden="true"><span></span><span></span></div>
        ${lista.length ? `<div class="tabla-desliza hoja-tabla"><table class="tabla"><thead><tr><th scope="col">Alumno</th><th scope="col">Salón</th>
          <th scope="col">Libro</th><th scope="col">Debió entregar</th><th scope="col">Retraso</th><th scope="col">Contacto del tutor</th></tr></thead>
          <tbody>${filas}</tbody></table></div>` : ''}
        <div class="hoja-pie"><span>El reporte se genera del estado actual de los préstamos. No requiere revisar registros a mano.</span>
          <span class="mono">En rojo, ${N.DIAS_CRITICOS} días o más</span></div>
      </section>`;
  }

  // ---------------------------------------------------------- empleados
  function empleados(ctx) {
    const { E, B, N, x, sesion } = ctx;
    const esAdministrador = sesion.perfil === 'administrador';
    const lista = ctx.ordenar('empleados', E.datos.empleados, {
      codigo: e => e.codigo, nombre: e => B.nombreCompleto(e), puesto: e => e.puesto, correo: e => e.correo, perfil: e => e.perfil
    });
    const elegido = lista.find(e => e.id === E.seleccion.empleados);
    const administradores = lista.filter(e => e.perfil === 'administrador').length;
    const resumen = `${N.plural(lista.length, 'persona')} en la plantilla${administradores ? ` · ${administradores} con perfil de administrador` : ''}`;
    const aviso = esAdministrador ? 'Como administrador puedes registrar personal y cambiar su perfil de acceso.'
      : 'Puedes registrar y modificar personal. Cambiar el perfil de acceso de alguien queda reservado al administrador.';
    const filas = lista.map(e => fila('empleados', e.id, [td(x(e.codigo), 'mono'),
      td(`${x(B.nombreCompleto(e))}${e.id === sesion.id ? ' <span class="tenue">(tú)</span>' : ''}`, 'fuerte'), td(x(e.puesto)),
      td(x(e.correo), 'mono'), td(e.perfil === 'administrador' ? '<strong>Administrador</strong>' : 'Bibliotecario')],
      { seleccionada: elegido && elegido.id === e.id, doble: 'modificar-empleado' })).join('');
    let detalle = panelVacio('Persona seleccionada', 'Elige a alguien de la plantilla para ver sus datos.');
    if (elegido) {
      detalle = panel('Persona seleccionada', `${persona(B.iniciales(elegido), x(B.nombreCompleto(elegido)), `${x(elegido.puesto)} · <span class="mono">${x(elegido.codigo)}</span>`)}
        ${datos([
          ['Correo', x(elegido.correo), true],
          ['Perfil', elegido.perfil === 'administrador' ? 'Administrador' : 'Bibliotecario'],
          ['Teléfono', elegido.telefono ? x(elegido.telefono) : '—', !!elegido.telefono],
          ['Dirección', [elegido.calle, elegido.colonia].filter(Boolean).map(x).join(', ') || '—'],
          ['Ingresó', N.fecha.conAno(elegido.ingreso), true]
        ])}
        ${acciones(boton('Modificar', 'editar', { id: 'boton-modificar-empleado', clase: 'btn-primario btn-ancho', accion: 'modificar-empleado' }))}`);
    }
    return `${encabezado(ctx, 'empleados', 'Empleados', resumen,
        boton('Registrar empleado', 'mas', { id: 'boton-nuevo-empleado', clase: 'btn-primario', accion: 'nuevo-empleado' }))}
      <p class="aviso-permisos" role="note">${ico('escudo')}${aviso}</p>
      ${tablaConPanel('Plantilla', '', cabecera(ctx, 'empleados', 'codigo', 'Código') + cabecera(ctx, 'empleados', 'nombre', 'Nombre')
        + cabecera(ctx, 'empleados', 'puesto', 'Puesto') + cabecera(ctx, 'empleados', 'correo', 'Correo')
        + cabecera(ctx, 'empleados', 'perfil', 'Perfil'), filas, 'No hay personal registrado.', detalle)}
      <p class="pista">${ico('info', 16)}Entra como bibliotecario para ver que el perfil de acceso queda bloqueado en el formulario.</p>`;
  }

  const PANTALLAS = { catalogo, prestamos, alumnos, deudores, empleados };

  // ----------------------------------------------------------------- login
  function login(ctx) {
    const { E, B, x } = ctx;
    const L = E.login;
    const rapido = (id, perfil, titulo) => {
      const e = B.empleado(id);
      return `<button type="button" class="perfil-rapido" id="entrar-${perfil}" data-accion="entrar-como" data-perfil="${perfil}"${L.ocupado ? ' disabled' : ''}>
        <span class="avatar" aria-hidden="true">${B.iniciales(e)}</span><span class="perfil-rapido-texto"><strong>${titulo}</strong>
        <span>${x(B.nombreCorto(e))} · ${x(e.puesto)}</span></span>${ico('flecha', 16)}</button>`;
    };
    return `<div class="login">
      <main class="ficha">
        <div class="ficha-franja" aria-hidden="true"></div>
        <div class="ficha-cuerpo">
          <span class="mono ficha-rotulo">Iniciar sesión</span>
          <div class="ficha-marca"><div class="logo logo-claro" aria-hidden="true">LOGO</div>
            <div><h1 class="ficha-titulo">Biblioteca Escolar</h1><p class="ficha-escuela">Escuela Primaria Adalberto Tejeda</p></div></div>
          <div class="doble-raya" aria-hidden="true"><span></span><span></span></div>
          <form class="login-form" data-formulario="login" novalidate>
            <div class="campo"><label for="correo" class="mono rotulo-campo">Correo electrónico</label>
              <div class="campo-icono">${ico('correo')}<input id="correo" name="correo" type="email" value="${x(L.correo)}"
                placeholder="usuario@ejemplo.com" autocomplete="username"></div></div>
            <div class="campo"><label for="contrasena" class="mono rotulo-campo">Contraseña</label>
              <div class="campo-icono">${ico('candado')}<input id="contrasena" name="contrasena" type="password" autocomplete="current-password"></div></div>
            <p class="login-error" id="error-login" role="alert">${L.error ? ico('alerta', 16) + x(L.error) : ''}</p>
            <button type="submit" id="boton-entrar" class="btn btn-primario btn-grande btn-ancho"${L.ocupado ? ' disabled' : ''}>${L.ocupado ? 'Verificando…' : `Entrar${ico('flecha')}`}</button>
          </form>
          <section class="entrada-rapida" aria-labelledby="titulo-rapida">
            <p class="entrada-rapida-titulo mono" id="titulo-rapida">Entrar rápido <span>· solo en este prototipo</span></p>
            <div class="entrada-rapida-botones">${rapido(1, 'administrador', 'Administrador')}${rapido(2, 'bibliotecario', 'Bibliotecario')}</div>
            <p class="entrada-rapida-nota">En el formulario, las cuentas de ejemplo aceptan cualquier contraseña.</p>
          </section>
        </div>
        <div class="ficha-perforacion" aria-hidden="true"></div>
      </main>
    </div>`;
  }

  return { app, login };
})();

</script>
<script>
/* Controlador del prototipo: estado, eventos, formularios y cuadros de diálogo.
   El tema (azul o mostaza) solo dibuja las pantallas; todo lo que pasa al
   pulsar un botón vive aquí, y las reglas se le preguntan al núcleo. */
'use strict';

(() => {
  const N = Nucleo;
  const ico = Iconos.svg;
  const x = N.escapar;

  const E = {
    datos: N.datosIniciales(),
    sesion: null,
    pantalla: 'prestamos',
    busqueda: { catalogo: '', prestamos: '', alumnos: '' },
    verBajas: false,
    vistaPrestamos: 'todos',
    salonDeudores: 'Todos',
    seleccion: { catalogo: null, prestamos: null, alumnos: null, empleados: null },
    orden: {
      catalogo: { col: 'titulo', asc: true },
      prestamos: { col: 'vence', asc: true },
      alumnos: { col: 'nombre', asc: true },
      empleados: { col: 'codigo', asc: true }
    },
    generado: new Date(),
    aviso: null,
    login: { correo: '', error: '', ocupado: false },
    dialogo: null,
    alerta: null,
    volverA: null
  };
  const B = N.crear(E.datos);
  const raiz = document.getElementById('app');
  const capa = document.getElementById('capa');

  // ------------------------------------------------------------ pintar
  function avisoDe(pantalla) {
    return E.aviso && E.aviso.pantalla === pantalla && Date.now() < E.aviso.hasta ? E.aviso.texto : '';
  }

  function ordenar(tabla, lista, claves) {
    const { col, asc } = E.orden[tabla];
    const valor = claves[col];
    if (!valor) return lista;
    return [...lista].sort((a, b) => {
      const va = valor(a);
      const vb = valor(b);
      const r = typeof va === 'number' && typeof vb === 'number' ? va - vb
        : String(va).localeCompare(String(vb), 'es', { numeric: true, sensitivity: 'base' });
      return asc ? r : -r;
    });
  }

  function contexto() {
    return { E, B, N, ico, x, ordenar, avisoDe, sesion: E.sesion && B.empleado(E.sesion.id) };
  }

  // Repinta sin perder el foco ni lo que se estaba escribiendo.
  function pintar(contenedor, html) {
    const activo = document.activeElement;
    const id = activo && activo.id && contenedor.contains(activo) ? activo.id : null;
    let inicio = null;
    let fin = null;
    try {
      if (id && typeof activo.selectionStart === 'number') { inicio = activo.selectionStart; fin = activo.selectionEnd; }
    } catch (e) { /* los campos numéricos no tienen selección */ }
    contenedor.innerHTML = html;
    if (id) {
      const el = document.getElementById(id);
      if (el) {
        el.focus({ preventScroll: true });
        try { if (inicio !== null) el.setSelectionRange(inicio, fin); } catch (e) { /* idem */ }
      }
    }
  }

  function render() {
    const y = window.scrollY;
    pintar(raiz, E.sesion ? Tema.app(contexto()) : Tema.login(contexto()));
    window.scrollTo(0, y);
    renderDialogo();
  }

  function renderDialogo() {
    let html = '';
    if (E.dialogo) html += DIALOGOS[E.dialogo.tipo](E.dialogo);
    if (E.alerta) html += dialogoAlerta(E.alerta);
    pintar(capa, html);
    const abierto = !!(E.dialogo || E.alerta);
    raiz.inert = abierto;
    document.body.classList.toggle('con-dialogo', abierto);
    if (E.alerta && E.alerta.enfocar) {
      E.alerta.enfocar = false;
      enfocar('alerta-aceptar');
    } else if (E.dialogo && E.dialogo.enfocar) {
      E.dialogo.enfocar = false;
      const primero = capa.querySelector('.dialogo [data-primero], .dialogo input, .dialogo select, .dialogo-pie .btn-primario');
      if (primero) primero.focus({ preventScroll: true });
    }
  }

  function enfocar(id) {
    const el = document.getElementById(id);
    if (el) el.focus({ preventScroll: true });
  }

  function avisar(pantalla, texto) {
    E.aviso = { pantalla, texto, hasta: Date.now() + 3500 };
    clearTimeout(avisar.reloj);
    avisar.reloj = setTimeout(() => { E.aviso = null; render(); }, 3600);
  }

  function abrir(dialogo) {
    const activo = document.activeElement;
    E.volverA = activo && activo.id ? activo.id : null;
    E.dialogo = Object.assign({ enfocar: true }, dialogo);
    render();
  }

  function cerrarDialogo() {
    E.dialogo = null;
    E.alerta = null;
    render();
    const destino = (E.volverA && document.getElementById(E.volverA)) || document.getElementById('titulo-pantalla');
    if (destino) destino.focus({ preventScroll: true });
  }

  function mostrarAlerta(titulo, error) {
    E.alerta = { titulo, error, detalle: false, enfocar: true };
    renderDialogo();
  }

  function cerrarAlerta() {
    E.alerta = null;
    renderDialogo();
    const destino = capa.querySelector('#dialogo-guardar, .dialogo input, .dialogo .btn-primario');
    if (destino) destino.focus({ preventScroll: true });
  }

  // Un error que no es de la base es un defecto del prototipo, no del usuario.
  function manejar(error, titulo) {
    if (error instanceof N.ErrorDeLaBase) {
      mostrarAlerta(titulo, error);
      return;
    }
    console.error(error);
    mostrarAlerta(titulo, new N.ErrorDeLaBase('El sistema tuvo un error interno.',
      'Avisa al equipo de desarrollo y pásale el detalle de abajo.', String(error)));
  }

  // ------------------------------------------------------ formularios
  const texto = (f, nombre) => (f.elements[nombre] ? f.elements[nombre].value.trim() : '');
  const numero = (f, nombre) => {
    const v = texto(f, nombre);
    return v === '' ? null : Number(v);
  };
  const leerCampos = f => {
    const campos = {};
    [...f.elements].forEach(el => { if (el.name) campos[el.name] = el.value; });
    return campos;
  };

  function entrar(id) {
    if (E.login.ocupado) return;
    E.login.ocupado = true;
    E.login.error = '';
    render();
    setTimeout(() => {
      const empleado = B.empleado(id);
      E.login.ocupado = false;
      E.sesion = { id: empleado.id, perfil: empleado.perfil };
      E.pantalla = 'prestamos';
      render();
      window.scrollTo(0, 0);
      enfocar('titulo-pantalla');
    }, 450);
  }

  const FORMULARIOS = {
    login(f) {
      const correo = texto(f, 'correo');
      const contrasena = f.elements.contrasena.value;
      E.login.correo = correo;
      if (!correo || !contrasena) {
        E.login.error = 'Escribe tu correo y tu contraseña.';
        render();
        enfocar(correo ? 'contrasena' : 'correo');
        return;
      }
      E.login.ocupado = true;
      E.login.error = '';
      render();
      setTimeout(() => {
        E.login.ocupado = false;
        try {
          const empleado = B.iniciarSesion(correo);
          E.sesion = { id: empleado.id, perfil: empleado.perfil };
          E.pantalla = 'prestamos';
          render();
          window.scrollTo(0, 0);
          enfocar('titulo-pantalla');
        } catch (error) {
          E.login.error = error.causa || 'No se pudo iniciar sesión.';
          render();
          enfocar('contrasena');
        }
      }, 600);
    },

    libro(f) {
      const d = E.dialogo;
      d.campos = leerCampos(f);
      const c = {
        titulo: texto(f, 'titulo'), autor: texto(f, 'autor'), editorial: texto(f, 'editorial'),
        coleccion: texto(f, 'coleccion'), asignatura: texto(f, 'asignatura'),
        existencias: numero(f, 'existencias'), ano: numero(f, 'ano'), paginas: numero(f, 'paginas')
      };
      d.errores = N.validarLibro(c, d.modo === 'alta');
      if (d.errores.length) { renderDialogo(); return; }
      try {
        const libro = d.modo === 'alta' ? B.registrarLibro(c) : B.modificarLibro(d.id, c);
        E.seleccion.catalogo = libro.id;
        cerrarDialogo();
        avisar('catalogo', d.modo === 'alta' ? `Se registró «${libro.titulo}».` : `Se actualizó «${libro.titulo}».`);
        render();
      } catch (error) {
        manejar(error, d.modo === 'alta' ? 'No se pudo registrar el libro' : 'No se pudo guardar el libro');
      }
    },

    baja(f) {
      const d = E.dialogo;
      d.motivo = texto(f, 'motivo');
      if (!d.motivo) {
        d.error = 'Indica por qué se da de baja el libro.';
        renderDialogo();
        enfocar('motivo');
        return;
      }
      try {
        const libro = B.darDeBaja(d.id, d.motivo);
        cerrarDialogo();
        avisar('catalogo', `«${libro.titulo}» quedó fuera del acervo.`);
        render();
      } catch (error) {
        manejar(error, 'No se pudo dar de baja');
      }
    },

    alumno(f) {
      const d = E.dialogo;
      d.campos = leerCampos(f);
      const c = {
        codigo: texto(f, 'codigo'), nombre: texto(f, 'nombre'), apellidos: texto(f, 'apellidos'),
        curp: texto(f, 'curp').toUpperCase(), grado: numero(f, 'grado'), grupo: texto(f, 'grupo'),
        telefono: texto(f, 'telefono'), calle: texto(f, 'calle'), colonia: texto(f, 'colonia')
      };
      d.errores = N.validarAlumno(c);
      if (d.errores.length) { renderDialogo(); return; }
      try {
        const alumno = d.modo === 'alta' ? B.registrarAlumno(c) : B.modificarAlumno(d.id, c);
        E.seleccion.alumnos = alumno.id;
        cerrarDialogo();
        avisar('alumnos', d.modo === 'alta' ? `Se registró a ${B.nombreCompleto(alumno)}.`
          : `Se actualizaron los datos de ${B.nombreCompleto(alumno)}.`);
        render();
      } catch (error) {
        manejar(error, d.modo === 'alta' ? 'No se pudo registrar al alumno' : 'No se pudieron guardar los cambios');
      }
    },

    maestros(f) {
      const cambios = {};
      B.salones().forEach(s => { cambios[s] = texto(f, `maestro-${s}`); });
      B.guardarMaestros(cambios);
      cerrarDialogo();
      avisar('alumnos', 'Se guardaron los maestros de grupo.');
      render();
    },

    empleado(f) {
      const d = E.dialogo;
      d.campos = leerCampos(f);
      const original = d.modo === 'cambio' ? B.empleado(d.id) : null;
      const perfil = f.elements.perfil.disabled ? (original ? original.perfil : 'bibliotecario') : texto(f, 'perfil');
      const c = {
        codigo: texto(f, 'codigo'), nombre: texto(f, 'nombre'), apellidos: texto(f, 'apellidos'),
        puesto: texto(f, 'puesto'), perfil, correo: texto(f, 'correo'), telefono: texto(f, 'telefono'),
        calle: texto(f, 'calle'), colonia: texto(f, 'colonia')
      };
      d.errores = N.validarEmpleado(c);
      if (d.errores.length) { renderDialogo(); return; }
      try {
        const empleado = d.modo === 'alta' ? B.registrarEmpleado(c, E.sesion) : B.modificarEmpleado(d.id, c, E.sesion);
        E.seleccion.empleados = empleado.id;
        cerrarDialogo();
        avisar('empleados', d.modo === 'alta' ? `Se registró a ${B.nombreCompleto(empleado)}.`
          : `Se actualizaron los datos de ${B.nombreCompleto(empleado)}.`);
        render();
      } catch (error) {
        manejar(error, d.modo === 'alta' ? 'No se pudo registrar al empleado' : 'No se pudieron guardar los cambios');
      }
    }
  };

  // ------------------------------------------------------------- acciones
  const idDe = (el, tabla) => Number(el.dataset.id || E.seleccion[tabla]);

  const camposDeLibro = l => ({
    titulo: l.titulo, autor: l.autor, editorial: l.editorial, coleccion: l.coleccion, asignatura: l.asignatura,
    existencias: String(l.existencias), ano: l.ano === null ? '' : String(l.ano), paginas: l.paginas === null ? '' : String(l.paginas)
  });
  const camposDeAlumno = a => ({
    codigo: a.codigo, nombre: a.nombre, apellidos: a.apellidos, curp: a.curp, grado: a.grado ? String(a.grado) : '',
    grupo: a.grupo || '', telefono: a.telefono, calle: a.calle, colonia: a.colonia
  });
  const camposDeEmpleado = e => ({
    codigo: e.codigo, nombre: e.nombre, apellidos: e.apellidos, puesto: e.puesto, perfil: e.perfil,
    correo: e.correo, telefono: e.telefono, calle: e.calle, colonia: e.colonia
  });

  function prestar() {
    const d = E.dialogo;
    if (!d.alumnoId || !d.libroId) return;
    try {
      const p = B.registrarPrestamo(d.alumnoId, d.libroId, E.sesion.id);
      E.seleccion.prestamos = p.id;
      E.vistaPrestamos = 'todos';
      E.busqueda.prestamos = '';
      E.pantalla = 'prestamos';
      cerrarDialogo();
      avisar('prestamos', `${B.nombreCompleto(B.alumno(p.alumnoId))} se llevó «${B.libro(p.libroId).titulo}».`);
      render();
    } catch (error) {
      if (!(error instanceof N.ErrorDeLaBase)) { manejar(error, 'No se pudo registrar el préstamo'); return; }
      d.error = error;
      renderDialogo();
    }
  }

  function confirmarDevolucion() {
    const d = E.dialogo;
    const p = B.prestamo(d.id);
    const libro = B.libro(p.libroId);
    B.devolver(d.id);
    if (E.seleccion.prestamos === d.id) E.seleccion.prestamos = null;
    cerrarDialogo();
    avisar('prestamos', `«${libro.titulo}» volvió al acervo.`);
    render();
  }

  const ACCIONES = {
    ir(el) {
      E.pantalla = el.dataset.pantalla;
      render();
      window.scrollTo(0, 0);
    },
    'entrar-como': el => entrar(el.dataset.perfil === 'administrador' ? 1 : 2),
    'cerrar-sesion'() {
      E.sesion = null;
      E.login = { correo: '', error: '', ocupado: false };
      E.pantalla = 'prestamos';
      render();
      window.scrollTo(0, 0);
      enfocar('correo');
    },
    seleccionar(el) {
      E.seleccion[el.dataset.tabla] = Number(el.dataset.id);
      render();
    },
    ordenar(el) {
      const orden = E.orden[el.dataset.tabla];
      if (orden.col === el.dataset.col) orden.asc = !orden.asc;
      else { orden.col = el.dataset.col; orden.asc = true; }
      render();
    },
    'ver-bajas'() {
      E.verBajas = !E.verBajas;
      E.aviso = null;
      render();
    },
    'vista-prestamos'(el) {
      E.vistaPrestamos = el.dataset.vista;
      E.aviso = null;
      render();
    },
    'actualizar-deudores'() {
      E.generado = new Date();
      avisar('deudores', 'Reporte actualizado con el estado actual de los préstamos.');
      render();
    },
    'nuevo-libro': () => abrir({ tipo: 'libro', modo: 'alta', errores: [],
      campos: { titulo: '', autor: '', editorial: '', coleccion: '', asignatura: '', existencias: '1', ano: '', paginas: '' } }),
    'modificar-libro'(el) {
      const libro = B.libro(idDe(el, 'catalogo'));
      if (!libro || !libro.activo) return;
      E.seleccion.catalogo = libro.id;
      abrir({ tipo: 'libro', modo: 'cambio', id: libro.id, campos: camposDeLibro(libro), errores: [] });
    },
    'baja-libro'(el) {
      const libro = B.libro(idDe(el, 'catalogo'));
      if (!libro || !libro.activo) return;
      abrir({ tipo: 'baja', id: libro.id, motivo: '', error: '' });
    },
    'motivo-rapido'(el) {
      E.dialogo.motivo = el.dataset.motivo;
      E.dialogo.error = '';
      renderDialogo();
      enfocar('motivo');
    },
    'nuevo-prestamo': () => abrir({ tipo: 'prestamo', qAlumno: '', qLibro: '', alumnoId: null, libroId: null, error: null }),
    'elegir-alumno'(el) {
      E.dialogo.alumnoId = Number(el.dataset.id);
      E.dialogo.error = null;
      renderDialogo();
    },
    'elegir-libro'(el) {
      E.dialogo.libroId = Number(el.dataset.id);
      E.dialogo.error = null;
      renderDialogo();
    },
    prestar,
    devolver(el) {
      const p = B.prestamo(idDe(el, 'prestamos'));
      if (!p || p.estado !== 'activo') return;
      abrir({ tipo: 'devolucion', id: p.id });
    },
    'confirmar-devolucion': confirmarDevolucion,
    historial(el) {
      const alumno = B.alumno(idDe(el, 'alumnos'));
      if (alumno) abrir({ tipo: 'historial', id: alumno.id });
    },
    'nuevo-alumno': () => abrir({ tipo: 'alumno', modo: 'alta', errores: [],
      campos: { codigo: '', nombre: '', apellidos: '', curp: '', grado: '', grupo: '', telefono: '', calle: '', colonia: '' } }),
    'modificar-alumno'(el) {
      const alumno = B.alumno(idDe(el, 'alumnos'));
      if (!alumno) return;
      E.seleccion.alumnos = alumno.id;
      abrir({ tipo: 'alumno', modo: 'cambio', id: alumno.id, campos: camposDeAlumno(alumno), errores: [] });
    },
    maestros: () => abrir({ tipo: 'maestros', campos: Object.assign({}, E.datos.maestros) }),
    'nuevo-empleado': () => abrir({ tipo: 'empleado', modo: 'alta', errores: [],
      campos: { codigo: '', nombre: '', apellidos: '', puesto: '', perfil: 'bibliotecario', correo: '', telefono: '', calle: '', colonia: '' } }),
    'modificar-empleado'(el) {
      const empleado = B.empleado(idDe(el, 'empleados'));
      if (!empleado) return;
      E.seleccion.empleados = empleado.id;
      abrir({ tipo: 'empleado', modo: 'cambio', id: empleado.id, campos: camposDeEmpleado(empleado), errores: [] });
    },
    'cerrar-dialogo': cerrarDialogo,
    'cerrar-alerta': cerrarAlerta,
    'ver-detalle'() {
      E.alerta.detalle = !E.alerta.detalle;
      renderDialogo();
    }
  };

  // ------------------------------------------------- piezas de diálogo
  function marco({ titulo, subtitulo = '', cuerpo, ancho = 560 }) {
    return `<div class="capa-fondo"><div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="dialogo-titulo"
      style="--ancho:${ancho}px"${E.alerta ? ' inert' : ''}>
      <div class="dialogo-cabeza">
        <div><h2 class="dialogo-titulo" id="dialogo-titulo">${titulo}</h2>${subtitulo ? `<p class="dialogo-subtitulo">${subtitulo}</p>` : ''}</div>
        <button type="button" class="boton-icono" data-accion="cerrar-dialogo" aria-label="Cerrar">${ico('cerrar')}</button>
      </div>${cuerpo}</div></div>`;
  }

  function campo({ id, etiqueta, nombre, valor = '', tipo = 'text', requerido = false, marcador = '', ancho = false,
    ayuda = '', extra = '' }) {
    return `<div class="campo${ancho ? ' campo-ancho' : ''}">
      <label for="${id}">${etiqueta}${requerido ? '<span class="obligatorio" aria-hidden="true"> *</span>' : ''}</label>
      <input id="${id}" name="${nombre}" type="${tipo}" value="${x(valor)}"${marcador ? ` placeholder="${x(marcador)}"` : ''}${requerido ? ' aria-required="true"' : ''}${ayuda ? ` aria-describedby="${id}-ayuda"` : ''} autocomplete="off" ${extra}>
      ${ayuda ? `<p class="campo-ayuda" id="${id}-ayuda">${ayuda}</p>` : ''}
    </div>`;
  }

  function selector({ id, etiqueta, nombre, valor = '', opciones, requerido = false, ancho = false, ayuda = '', bloqueado = false }) {
    const lista = opciones.map(o =>
