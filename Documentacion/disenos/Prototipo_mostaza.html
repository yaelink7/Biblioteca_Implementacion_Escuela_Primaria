      `<option value="${x(o.valor)}"${String(o.valor) === String(valor) ? ' selected' : ''}>${x(o.texto)}</option>`).join('');
    return `<div class="campo${ancho ? ' campo-ancho' : ''}">
      <label for="${id}">${etiqueta}${requerido ? '<span class="obligatorio" aria-hidden="true"> *</span>' : ''}</label>
      <div class="selector${bloqueado ? ' selector-bloqueado' : ''}"><select id="${id}" name="${nombre}"${bloqueado ? ' disabled' : ''}${ayuda ? ` aria-describedby="${id}-ayuda"` : ''}>${lista}</select>${ico(bloqueado ? 'candado' : 'abajo', 16)}</div>
      ${ayuda ? `<p class="campo-ayuda" id="${id}-ayuda">${ayuda}</p>` : ''}
    </div>`;
  }

  function errores(lista) {
    if (!lista || !lista.length) return '';
    return `<div class="errores" role="alert"><p class="errores-titulo">${ico('alerta')}Revisa estos datos:</p>
      <ul>${lista.map(e => `<li>${x(e)}</li>`).join('')}</ul></div>`;
  }

  function pie(principal, { peligro = false, tipo = 'submit', accion = '', deshabilitado = false, cancelar = 'Cancelar' } = {}) {
    return `<div class="dialogo-pie">
      <button type="button" class="btn btn-borde" data-accion="cerrar-dialogo">${cancelar}</button>
      <button type="${tipo}" id="dialogo-guardar" class="btn ${peligro ? 'btn-peligro' : 'btn-primario'}"${accion ? ` data-accion="${accion}"` : ''}${deshabilitado ? ' disabled' : ''}>${principal}</button>
    </div>`;
  }

  function dialogoAlerta(a) {
    const error = a.error;
    return `<div class="capa-fondo capa-alerta"><div class="dialogo dialogo-alerta" role="alertdialog" aria-modal="true"
      aria-labelledby="alerta-titulo" aria-describedby="alerta-texto" style="--ancho:470px">
      <div class="alerta-icono">${ico('alerta', 22)}</div>
      <h2 class="dialogo-titulo" id="alerta-titulo">${x(a.titulo)}</h2>
      <p class="alerta-texto" id="alerta-texto"><strong>${x(error.causa)}</strong> ${x(error.queHacer)}</p>
      <button type="button" class="enlace-detalle" data-accion="ver-detalle" aria-expanded="${a.detalle}">${a.detalle ? 'Ocultar' : 'Ver'} detalle técnico</button>
      ${a.detalle ? `<pre class="alerta-detalle">${x(error.detalle)}</pre>` : ''}
      <div class="dialogo-pie"><button type="button" class="btn btn-primario" id="alerta-aceptar" data-accion="cerrar-alerta">Entendido</button></div>
    </div></div>`;
  }

  const DIALOGOS = {
    libro(d) {
      const c = d.campos;
      const colecciones = [{ valor: '', texto: 'Sin colección' },
        ...N.COLECCIONES.map(k => ({ valor: k.nombre, texto: `${k.nombre} · ${k.grados}` }))];
      const asignaturas = [{ valor: '', texto: 'Sin asignatura' }, ...N.ASIGNATURAS.map(a => ({ valor: a, texto: a }))];
      const cuerpo = `<form class="dialogo-cuerpo" data-formulario="libro" novalidate>${errores(d.errores)}
        <div class="rejilla">
          ${campo({ id: 'f-titulo', etiqueta: 'Título', nombre: 'titulo', valor: c.titulo, requerido: true, ancho: true })}
          ${campo({ id: 'f-autor', etiqueta: 'Autor', nombre: 'autor', valor: c.autor, requerido: true })}
          ${campo({ id: 'f-editorial', etiqueta: 'Editorial', nombre: 'editorial', valor: c.editorial })}
          ${selector({ id: 'f-coleccion', etiqueta: 'Colección', nombre: 'coleccion', valor: c.coleccion, opciones: colecciones,
            ayuda: 'Libros del Rincón, con los grados de cada una.' })}
          ${selector({ id: 'f-asignatura', etiqueta: 'Asignatura', nombre: 'asignatura', valor: c.asignatura, opciones: asignaturas })}
          ${campo({ id: 'f-existencias', etiqueta: 'Ejemplares', nombre: 'existencias', valor: c.existencias, tipo: 'number',
            requerido: true, extra: 'min="0" step="1" inputmode="numeric"',
            ayuda: d.modo === 'cambio' ? 'Los que están hoy en el estante.' : '' })}
          ${campo({ id: 'f-ano', etiqueta: 'Año de publicación', nombre: 'ano', valor: c.ano, tipo: 'number',
            marcador: 'Sin especificar', extra: 'min="1400" step="1" inputmode="numeric"' })}
          ${campo({ id: 'f-paginas', etiqueta: 'Número de páginas', nombre: 'paginas', valor: c.paginas, tipo: 'number',
            marcador: 'Sin especificar', extra: 'min="1" step="1" inputmode="numeric"' })}
        </div>
        <p class="nota-campos">* Campos obligatorios</p>
        ${pie('Guardar')}</form>`;
      return marco({ titulo: d.modo === 'alta' ? 'Registrar libro' : 'Modificar libro', cuerpo, ancho: 660,
        subtitulo: d.modo === 'cambio' ? x(B.libro(d.id).titulo) : 'Se agrega al catálogo con los ejemplares que indiques.' });
    },

    baja(d) {
      const libro = B.libro(d.id);
      const motivos = ['Extravío', 'Deterioro', 'Donación'];
      const cuerpo = `<form class="dialogo-cuerpo" data-formulario="baja" novalidate>
        <p class="dialogo-texto">¿Por qué se da de baja «${x(libro.titulo)}»? Sale del catálogo, pero su historial de préstamos se conserva.</p>
        <div class="rejilla">${campo({ id: 'motivo', etiqueta: 'Motivo', nombre: 'motivo', valor: d.motivo, requerido: true, ancho: true,
          marcador: 'Por ejemplo: extravío, deterioro, donación' })}</div>
        <div class="sugerencias" role="group" aria-label="Motivos frecuentes">${motivos.map(m =>
          `<button type="button" class="sugerencia" data-accion="motivo-rapido" data-motivo="${m}">${m}</button>`).join('')}</div>
        ${d.error ? `<p class="error-linea" role="alert">${ico('alerta', 16)}${x(d.error)}</p>` : ''}
        ${pie('Dar de baja', { peligro: true })}</form>`;
      return marco({ titulo: 'Dar de baja', cuerpo, ancho: 540 });
    },

    prestamo(d) {
      const alumnos = B.alumnosVisibles(d.qAlumno)
        .sort((a, b) => B.nombreCompleto(a).localeCompare(B.nombreCompleto(b), 'es'));
      const libros = B.librosVisibles(d.qLibro, false).sort((a, b) => a.titulo.localeCompare(b.titulo, 'es'));
      const alumno = d.alumnoId && B.alumno(d.alumnoId);
      const libro = d.libroId && B.libro(d.libroId);

      const opcionesAlumno = alumnos.map(a => {
        const activo = B.prestamoActivoDe(a.id);
        const nota = activo ? ` · <span class="opcion-nota">tiene «${x(B.libro(activo.libroId).titulo)}»</span>` : '';
        return `<button type="button" class="opcion" data-accion="elegir-alumno" data-id="${a.id}" aria-pressed="${a.id === d.alumnoId}">
          <span class="opcion-principal">${x(B.nombreCompleto(a))}</span>
          <span class="opcion-detalle">${B.salon(a)} · ${x(a.codigo)}${nota}</span></button>`;
      }).join('') || '<p class="opciones-vacio">Nadie coincide con esa búsqueda.</p>';

      const opcionesLibro = libros.map(l => `<button type="button" class="opcion" data-accion="elegir-libro" data-id="${l.id}" aria-pressed="${l.id === d.libroId}">
          <span class="opcion-principal">${x(l.titulo)}</span>
          <span class="opcion-detalle">${x(l.autor)} · <span class="${l.existencias ? '' : 'opcion-agotado'}">${B.estadoLibro(l)}</span></span></button>`)
        .join('') || '<p class="opciones-vacio">Ningún libro coincide con esa búsqueda.</p>';

      let resumen;
      if (alumno && libro) {
        resumen = `<p class="resumen-prestamo"><strong>${x(B.nombreCompleto(alumno))}</strong> (${B.salon(alumno)}) se lleva <strong>${x(libro.titulo)}</strong></p>
          <p class="plazo-prestamo">El plazo es de ${N.DIAS_DE_PRESTAMO} días naturales; la fecha exacta queda registrada al confirmar.</p>`;
      } else {
        resumen = `<p class="resumen-prestamo">${alumno ? 'Ahora elige el libro.' : libro ? 'Ahora elige al alumno.' : 'Elige un alumno y un libro.'}</p>`;
      }
      const error = d.error ? `<div class="error-bloque" role="alert">${ico('alerta')}<div><strong>${x(d.error.causa)}</strong>
        <span>${x(d.error.queHacer)}</span></div></div>` : '';

      const cuerpo = `<div class="dialogo-cuerpo">
        <div class="busquedas">
          <section class="busqueda-paso" aria-labelledby="paso-alumno">
            <h3 class="paso" id="paso-alumno">1. ¿Quién se lo lleva?</h3>
            <div class="busqueda-dialogo">${ico('buscar')}<input id="q-alumno" type="search" data-primero data-busqueda-dialogo="qAlumno"
              value="${x(d.qAlumno)}" placeholder="Nombre, código o salón (4B)" aria-label="Buscar alumno" autocomplete="off"></div>
            <div class="opciones" role="group" aria-label="Alumnos">${opcionesAlumno}</div>
          </section>
          <section class="busqueda-paso" aria-labelledby="paso-libro">
            <h3 class="paso" id="paso-libro">2. ¿Qué libro?</h3>
            <div class="busqueda-dialogo">${ico('buscar')}<input id="q-libro" type="search" data-busqueda-dialogo="qLibro"
              value="${x(d.qLibro)}" placeholder="Título o autor" aria-label="Buscar libro" autocomplete="off"></div>
            <div class="opciones" role="group" aria-label="Libros">${opcionesLibro}</div>
          </section>
        </div>
        <div class="cierre-prestamo" aria-live="polite">${resumen}${error}</div>
        ${pie('Prestar', { tipo: 'button', accion: 'prestar', deshabilitado: !(alumno && libro) })}</div>`;
      return marco({ titulo: 'Registrar préstamo', cuerpo, ancho: 860,
        subtitulo: 'Dos búsquedas y un botón. El plazo y el inventario los calcula la base.' });
    },

    devolucion(d) {
      const p = B.prestamo(d.id);
      const alumno = B.alumno(p.alumnoId);
      const libro = B.libro(p.libroId);
      const s = B.situacion(p);
      const cuerpo = `<div class="dialogo-cuerpo">
        <p class="dialogo-texto">¿${x(B.nombreCompleto(alumno))} devolvió «${x(libro.titulo)}»?</p>
        <dl class="datos-dialogo">
          <dt>Prestado</dt><dd>${N.fecha.conAno(p.fechaPrestamo)}</dd>
          <dt>Vencía</dt><dd>${N.fecha.conAno(p.fechaLimite)}</dd>
          <dt>Situación</dt><dd class="${s.tipo === 'vencido' ? 'texto-rojo' : ''}">${s.texto}</dd>
        </dl>
        <p class="dialogo-nota">La fecha de devolución la pone la base al confirmar, y el ejemplar vuelve al estante.</p>
        ${pie('Sí, lo devolvió', { tipo: 'button', accion: 'confirmar-devolucion', cancelar: 'No' })}</div>`;
      return marco({ titulo: 'Registrar devolución', cuerpo, ancho: 500 });
    },

    historial(d) {
      const alumno = B.alumno(d.id);
      const lista = B.historialDe(alumno.id);
      let resumen = 'Este alumno todavía no ha pedido ningún libro.';
      if (lista.length) {
        const devueltos = lista.filter(p => p.estado === 'devuelto').length;
        const activos = lista.length - devueltos;
        const vencidos = lista.filter(p => B.situacion(p).tipo === 'vencido').length;
        const partes = [N.plural(lista.length, 'préstamo')];
        if (devueltos) partes.push(N.plural(devueltos, 'devuelto'));
        if (activos) partes.push(`${activos} sin devolver`);
        if (vencidos) partes.push(N.plural(vencidos, 'vencido'));
        resumen = partes.join(' · ');
      }
      const filas = lista.map(p => {
        const s = B.situacion(p);
        return `<tr><td>${x(B.libro(p.libroId).titulo)}</td><td>${N.fecha.numerica(p.fechaPrestamo)}</td>
          <td>${N.fecha.numerica(p.fechaLimite)}</td><td>${p.fechaDevolucion ? N.fecha.numerica(p.fechaDevolucion) : '—'}</td>
          <td class="${s.tipo === 'vencido' ? 'texto-rojo' : ''}">${s.texto}</td></tr>`;
      }).join('');
      const cuerpo = `<div class="dialogo-cuerpo">
        <p class="dialogo-texto">${resumen}</p>
        ${lista.length ? `<div class="tabla-dialogo-marco"><table class="tabla-dialogo"><thead><tr><th scope="col">Libro</th>
          <th scope="col">Prestado</th><th scope="col">Vencía</th><th scope="col">Devuelto</th><th scope="col">Situación</th></tr></thead>
          <tbody>${filas}</tbody></table></div>` : ''}
        <p class="dialogo-nota">El historial se conserva aunque el libro se dé de baja del acervo.</p>
        <div class="dialogo-pie"><button type="button" class="btn btn-primario" data-accion="cerrar-dialogo">Cerrar</button></div></div>`;
      return marco({ titulo: 'Historial de préstamos', cuerpo, ancho: 760,
        subtitulo: `${x(B.nombreCompleto(alumno))} · ${B.salon(alumno)} · ${x(alumno.codigo)}` });
    },

    alumno(d) {
      const c = d.campos;
      const clave = c.grado && c.grupo ? `${c.grado}${c.grupo}` : '';
      const maestro = clave ? E.datos.maestros[clave] : '';
      const grados = [{ valor: '', texto: 'Sin asignar' }, ...[1, 2, 3, 4, 5, 6].map(g => ({ valor: String(g), texto: `${g}.º` }))];
      const grupos = [{ valor: '', texto: '—' }, ...N.GRUPOS.map(g => ({ valor: g, texto: g }))];
      const textoMaestro = maestro ? x(maestro)
        : clave ? 'Este salón aún no tiene maestro. Se asigna en «Maestros de grupo».' : 'Se muestra al elegir grado y grupo.';
      const cuerpo = `<form class="dialogo-cuerpo" data-formulario="alumno" novalidate>${errores(d.errores)}
        <div class="rejilla">
          ${campo({ id: 'f-codigo', etiqueta: 'Código', nombre: 'codigo', valor: c.codigo, requerido: true, marcador: 'A-0401' })}
          ${campo({ id: 'f-curp', etiqueta: 'CURP', nombre: 'curp', valor: c.curp, marcador: 'CURV200412MVZRMLA4',
            extra: 'maxlength="18" spellcheck="false" style="text-transform:uppercase"', ayuda: '18 caracteres; se revisa el formato oficial.' })}
          ${campo({ id: 'f-nombre', etiqueta: 'Nombre', nombre: 'nombre', valor: c.nombre, requerido: true })}
          ${campo({ id: 'f-apellidos', etiqueta: 'Apellidos', nombre: 'apellidos', valor: c.apellidos, requerido: true })}
          ${selector({ id: 'f-grado', etiqueta: 'Grado', nombre: 'grado', valor: c.grado, opciones: grados })}
          ${selector({ id: 'f-grupo', etiqueta: 'Grupo', nombre: 'grupo', valor: c.grupo, opciones: grupos })}
          <div class="campo campo-ancho"><span class="etiqueta-campo">Maestro de grupo</span>
            <p class="dato-fijo" aria-live="polite">${ico('maestro', 16)}${textoMaestro}</p></div>
          <p class="separador-campos campo-ancho">Datos del tutor</p>
          ${campo({ id: 'f-telefono', etiqueta: 'Teléfono del tutor', nombre: 'telefono', valor: c.telefono, requerido: true,
            tipo: 'tel', marcador: '229 555 0100' })}
          ${campo({ id: 'f-colonia', etiqueta: 'Colonia', nombre: 'colonia', valor: c.colonia })}
          ${campo({ id: 'f-calle', etiqueta: 'Calle y número', nombre: 'calle', valor: c.calle, ancho: true })}
        </div>
        <p class="nota-campos">* Campos obligatorios. El teléfono del tutor sirve para avisarle si hay un préstamo vencido.</p>
        ${pie('Guardar')}</form>`;
      return marco({ titulo: d.modo === 'alta' ? 'Registrar alumno' : 'Modificar alumno', cuerpo, ancho: 680,
        subtitulo: d.modo === 'cambio' ? x(B.nombreCompleto(B.alumno(d.id))) : 'Sin correo: la escuela se comunica con el tutor por teléfono.' });
    },

    maestros(d) {
      const filas = B.salones().map(s => {
        const etiqueta = `${s.charAt(0)}.º ${s.slice(1)}`;
        const cuantos = E.datos.alumnos.filter(a => a.activo && B.claveSalon(a) === s).length;
        return `<tr><th scope="row">${etiqueta}</th>
          <td><input id="m-${s}" name="maestro-${s}" value="${x(d.campos[s] || '')}" placeholder="Sin asignar"
            aria-label="Maestro de ${etiqueta}" autocomplete="off"${s === B.salones()[0] ? ' data-primero' : ''}></td>
          <td class="celda-tenue">${N.plural(cuantos, 'alumno')}</td></tr>`;
      }).join('');
      const cuerpo = `<form class="dialogo-cuerpo" data-formulario="maestros" novalidate>
        <p class="dialogo-texto">El maestro se asigna una vez por salón y todos sus alumnos lo heredan. Al empezar otro ciclo escolar se corrige aquí.</p>
        <div class="tabla-dialogo-marco"><table class="tabla-dialogo tabla-maestros"><thead><tr><th scope="col">Salón</th>
          <th scope="col">Maestro de grupo</th><th scope="col">Alumnos</th></tr></thead><tbody>${filas}</tbody></table></div>
        ${pie('Guardar')}</form>`;
      return marco({ titulo: 'Maestros de grupo', cuerpo, ancho: 620 });
    },

    empleado(d) {
      const c = d.campos;
      const esAdministrador = E.sesion.perfil === 'administrador';
      const esPropio = d.modo === 'cambio' && d.id === E.sesion.id;
      const bloqueado = !esAdministrador || esPropio;
      const ayudaPerfil = !esAdministrador ? 'Solo un administrador asigna o cambia perfiles de acceso.'
        : esPropio ? 'No puedes cambiar tu propio perfil de acceso.' : 'El administrador además puede cambiar perfiles de acceso.';
      const puestos = [{ valor: '', texto: 'Elige el puesto' }, ...N.PUESTOS.map(p => ({ valor: p, texto: p }))];
      const perfiles = [{ valor: 'bibliotecario', texto: 'Bibliotecario' }, { valor: 'administrador', texto: 'Administrador' }];
      const cuerpo = `<form class="dialogo-cuerpo" data-formulario="empleado" novalidate>${errores(d.errores)}
        <div class="rejilla">
          ${campo({ id: 'f-codigo', etiqueta: 'Código', nombre: 'codigo', valor: c.codigo, requerido: true, marcador: 'EMP-004' })}
          ${selector({ id: 'f-puesto', etiqueta: 'Puesto', nombre: 'puesto', valor: c.puesto, opciones: puestos, requerido: true })}
          ${campo({ id: 'f-nombre', etiqueta: 'Nombre', nombre: 'nombre', valor: c.nombre, requerido: true })}
          ${campo({ id: 'f-apellidos', etiqueta: 'Apellidos', nombre: 'apellidos', valor: c.apellidos, requerido: true })}
          ${selector({ id: 'f-perfil', etiqueta: 'Perfil en el sistema', nombre: 'perfil', valor: c.perfil, opciones: perfiles,
            requerido: true, bloqueado, ayuda: ayudaPerfil })}
          ${campo({ id: 'f-correo', etiqueta: 'Correo', nombre: 'correo', valor: c.correo, requerido: true, tipo: 'email',
            marcador: 'empleado@ejemplo.com', ayuda: 'Es con lo que inicia sesión.' })}
          ${campo({ id: 'f-telefono', etiqueta: 'Teléfono', nombre: 'telefono', valor: c.telefono, tipo: 'tel' })}
          ${campo({ id: 'f-colonia', etiqueta: 'Colonia', nombre: 'colonia', valor: c.colonia })}
          ${campo({ id: 'f-calle', etiqueta: 'Calle y número', nombre: 'calle', valor: c.calle, ancho: true })}
        </div>
        <p class="nota-campos">* Campos obligatorios. El correo es con lo que el empleado inicia sesión.</p>
        ${pie('Guardar')}</form>`;
      return marco({ titulo: d.modo === 'alta' ? 'Registrar empleado' : 'Modificar empleado', cuerpo, ancho: 680,
        subtitulo: d.modo === 'cambio' ? x(B.nombreCompleto(B.empleado(d.id))) : '' });
    }
  };

  // --------------------------------------------------------------- eventos
  // El doble clic se detecta a mano: el primer clic selecciona y repinta, y
  // el navegador ya no reconoce el segundo como parte del mismo elemento.
  let ultimoClic = { clave: '', momento: 0 };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-accion]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    const accion = ACCIONES[el.dataset.accion];
    if (!accion) return;
    e.preventDefault();
    if (el.dataset.doble) {
      const clave = `${el.dataset.tabla}:${el.dataset.id}`;
      const momento = Date.now();
      if (ultimoClic.clave === clave && momento - ultimoClic.momento < 450) {
        ultimoClic = { clave: '', momento: 0 };
        ACCIONES[el.dataset.doble](el, e);
        return;
      }
      ultimoClic = { clave, momento };
    }
    accion(el, e);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (E.alerta) { cerrarAlerta(); return; }
      if (E.dialogo) { cerrarDialogo(); return; }
    }
    const el = e.target.closest('[role="button"][data-accion], tr[data-accion]');
    if (el && e.target === el && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      el.click();
    }
  });

  document.addEventListener('input', e => {
    const el = e.target;
    // Buscar o filtrar cambia el resumen: el aviso anterior deja de aplicar.
    if (el.dataset.busqueda) { E.busqueda[el.dataset.busqueda] = el.value; E.aviso = null; render(); return; }
    if (el.dataset.busquedaDialogo) { E.dialogo[el.dataset.busquedaDialogo] = el.value; renderDialogo(); return; }
    if (E.dialogo && el.name) {
      if (E.dialogo.campos) E.dialogo.campos[el.name] = el.value;
      if (el.name === 'motivo') E.dialogo.motivo = el.value;
    }
    if (el.id === 'correo' && !E.sesion) E.login.correo = el.value;
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.cambio === 'salon-deudores') { E.salonDeudores = el.value; E.aviso = null; render(); return; }
    if (el.dataset.cambio === 'ver-bajas') { E.verBajas = el.checked; E.aviso = null; render(); return; }
    if (E.dialogo && E.dialogo.tipo === 'alumno' && (el.name === 'grado' || el.name === 'grupo')) {
      E.dialogo.campos[el.name] = el.value;
      renderDialogo();
    }
  });

  document.addEventListener('submit', e => {
    e.preventDefault();
    const formulario = FORMULARIOS[e.target.dataset.formulario];
    if (formulario) formulario(e.target);
  });

  render();
})();

</script>
</body>
</html>
